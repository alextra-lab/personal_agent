id: no-raw-anthropic-client
language: python
severity: error
message: >-
  Pass http_client=create_guarded_http_client() to anthropic.Anthropic/
  AsyncAnthropic (ADR-0132 D2) instead of letting the SDK build its own
  unguarded transport.
rule:
  any:
    - pattern: anthropic.Anthropic($$$)
    - pattern: anthropic.AsyncAnthropic($$$)
  not:
    has:
      stopBy: end
      kind: keyword_argument
      has:
        field: name
        regex: '^http_client$'
