# Filebeat config for the caddy-access sidecar (FRE-1146 / ADR-0132 D3).
#
# Ships the cloud-sim-caddy container's Docker json-file access logs into
# caddy-access-*. No Docker autodiscover / no /var/run/docker.sock mount: the
# caddy container's ID (needed to locate its log file, since Docker assigns
# it dynamically) is resolved by resolve-caddy-container.sh at startup by
# reading config.v2.json under the read-only /var/lib/docker/containers mount
# — filesystem access only, no Docker API surface. See the entrypoint script
# and Dockerfile.filebeat for that resolution step; ${CADDY_CONTAINER_ID} is
# exported by it before Filebeat starts.
#
# The index template + ILM policy (caddy-access-*) are owned by
# scripts/setup-elasticsearch.sh (ADR-0128's single sanctioned mapping path)
# — Filebeat's own template/ILM setup is disabled below so it never competes.

filebeat.inputs:
  - type: filestream
    id: caddy-access
    paths:
      - /var/lib/docker/containers/${CADDY_CONTAINER_ID}/*.log
    parsers:
      - container:
          stream: stdout

processors:
  # Caddy's container-parser message is a raw JSON string; decode it under
  # caddy.* so it doesn't collide with Filebeat's own log.*/container.* fields.
  - decode_json_fields:
      fields: ["message"]
      target: "caddy"
      overwrite_keys: true
      add_error_key: true
  # Defensive second filter: keep only decoded records that are actually an
  # access-log entry (named or default Caddy access logger), in case a
  # non-access-log JSON line ever reaches stdout.
  - drop_event:
      when:
        not:
          regexp:
            caddy.logger: '^http\.log\.access(?:\.|$)'

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "caddy-access-%{+yyyy-MM}"

setup.template.enabled: false
setup.ilm.enabled: false
