# Seshat API Gateway — Access Control Configuration
# FRE-206 / docs/plans/2026-04-14-fre-206-gateway-design.md
#
# Each token entry declares:
#   name       : human-readable label (used in logs)
#   secret     : bearer token value, as a "${ENV_VAR}" reference. This file is public, so it holds
#                no literal secret. An entry whose variable is unset or empty loads no token (FRE-1732).
#   scopes     : list of granted permission scopes
#   rate_limit : max requests per hour (integer or "N/hour")
#
# In local dev (gateway_auth_enabled: false) tokens are ignored.
# For production, inject secrets via environment variables.

tokens:
  - name: claude-code-local
    secret: "${GATEWAY_TOKEN_CLAUDE_CODE}"
    scopes:
      - knowledge:read
      - knowledge:write
      - sessions:read
      - observations:read
    rate_limit: 100

  - name: pwa-client
    secret: "${GATEWAY_TOKEN_PWA}"
    scopes:
      - knowledge:read
      - sessions:read
      - sessions:write  # ADR-0079: PATCH session execution profile
      - observations:read
      - feedback:write  # FRE-407: per-turn user value rating
    rate_limit: 200

  - name: external-agent
    secret: "${GATEWAY_TOKEN_EXTERNAL_AGENT}"
    scopes:
      - knowledge:read
      - knowledge:write
      - sessions:read
      - observations:read
    rate_limit: "500/hour"
