# Cost Check Gate — per-role budgets and denial behaviour (ADR-0065).
#
# Caps user-confirmed 2026-05-01 (FRE-302 implementation session).
# entity_extraction and captains_log dailies were bumped from the ADR
# placeholders ($1.50 / $0.50) to $2.50 each — "for the days I have a lot
# of interaction".
#
# The auto-tuning monitor (FRE-311) will eventually propose Linear tickets
# to raise/lower these caps based on observed utilisation. Until then, edit
# this file by hand and ask the user before deviating from confirmed values.
version: 1

roles:
  main_inference:
    default_output_tokens: 1024
    safety_factor: 1.2
    on_denial: raise        # FastAPI 503 → PWA error card
  entity_extraction:
    default_output_tokens: 256
    safety_factor: 1.2
    on_denial: nack         # background consumer NACK → Redis Streams redeliver
  captains_log:
    default_output_tokens: 512
    safety_factor: 1.2
    on_denial: nack
  insights:
    default_output_tokens: 512
    safety_factor: 1.2
    on_denial: nack
  promotion:
    default_output_tokens: 256
    safety_factor: 1.2
    on_denial: nack
  freshness:
    default_output_tokens: 128
    safety_factor: 1.2
    on_denial: nack
  skill_routing:
    default_output_tokens: 64       # returns a small JSON array of skill names
    safety_factor: 1.2
    on_denial: raise                # surface failures instead of silently returning []
  study:
    default_output_tokens: 512
    safety_factor: 1.2
    on_denial: raise                # standalone one-shot script (scripts/study/run_ingest.py) — surface budget denial immediately, nothing to NACK/redeliver
  artifact_builder:
    default_output_tokens: 1024
    safety_factor: 1.2
    on_denial: raise        # user-facing build path (ADR-0118 T1, FRE-879) — mirrors main_inference

# Roles deliberately run WITHOUT a per-role dollar cap (FRE-989 finding two).
#
# Listing a role here is a DECISION. It is what distinguishes "we chose not to
# cap this" from "we forgot" — before FRE-989 those two were indistinguishable
# and there was no signal either way. The startup validator and the CI config
# guard both reject a declared role that is neither capped nor listed here.
#
# "Uncapped" means no PER-ROLE ceiling, not unlimited: caps_for() always folds
# in the synthetic weekly `_total` cap below, so these three are still bounded
# collectively. What they lack is a per-role counter row, which is why per-role
# counter queries and the FRE-547 cap-utilisation panel show nothing for them.
#
# Why no number rather than a number: ADR-0120 (Proposed) supersedes ADR-0065
# and its decision 1 is to remove hard, process-breaking dollar caps outright.
# Inventing cap values now is work that ADR would delete. Per-role spend IS
# measurable in api_costs.purpose, so a number can be set from observation
# whenever ADR-0120 resolves.
uncapped_roles:
  - insights     # live — captains_log/feedback.py
  - promotion    # declared, but NO live call site as of 2026-07-29 (FRE-989)
  - freshness    # declared, but NO live call site as of 2026-07-29 (FRE-989)

caps:
  - {time_window: daily,  role: entity_extraction, cap_usd: 5.00}   # reset 2026-07-04: FRE-771 powered A/B complete (was TEMP BUMP to $25.00)
  - {time_window: daily,  role: captains_log,      cap_usd: 5.00}   # raised 2026-07-24 (was $2.50, breaching — observed daily peak $2.76); ~2x peak, owner-approved
  - {time_window: daily,  role: main_inference,    cap_usd: 10.00}  # right-sized 2026-07-24 (was $15 stale FRE-334 bump); ~2x observed daily peak $4.94, owner-approved
  - {time_window: daily,  role: skill_routing,     cap_usd: 0.10}   # user-confirmed 2026-05-07
  - {time_window: daily,  role: study,              cap_usd: 5.00}   # FRE-839: ADR-0114 study categorizer, isolated from entity_extraction's cap so a one-time corpus run can never contend with live prod extraction — owner-confirmed 2026-07-10
  - {time_window: daily,  role: artifact_builder,  cap_usd: 5.00}   # ADR-0118 T1 (FRE-879): mirrors main_inference's non-temp-bumped baseline — owner-confirmed 2026-07-17
  - {time_window: weekly, role: entity_extraction, cap_usd: 7.00}   # reset 2026-07-04: FRE-771 powered A/B complete (was TEMP BUMP to $45.00)
  - {time_window: weekly, role: main_inference,    cap_usd: 25.00}  # right-sized 2026-07-24 (was $40 stale FRE-334 bump); ~3x observed weekly peak $7.91, owner-approved
  - {time_window: weekly, role: skill_routing,     cap_usd: 0.50}   # user-confirmed 2026-05-07
  - {time_window: weekly, role: study,              cap_usd: 7.00}   # FRE-839: see daily cap note above — owner-confirmed 2026-07-10
  - {time_window: weekly, role: artifact_builder,  cap_usd: 18.00}  # ADR-0118 T1 (FRE-879): mirrors main_inference's non-temp-bumped baseline — owner-confirmed 2026-07-17
  - {time_window: weekly, role: _total,            cap_usd: 30.00}  # right-sized 2026-07-24 (was $50 stale FRE-334 bump); ~2x observed weekly peak $13.98, owner-approved. Keep in sync with AGENT_CLOUD_WEEKLY_BUDGET_USD (.env)
