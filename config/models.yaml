# Model configuration (ADR-0031 + ADR-0033: two-tier taxonomy + LiteLLM)
#
# ── Model Taxonomy (ADR-0033) ──────────────────────────────────────
#   PRIMARY:    Orchestrator brain (reasoning, tool calling, decomposition)
#   SUB_AGENT:  Focused task completion (no thinking, fast, bounded output)
#
# ── Rules (ADR-0031) ───────────────────────────────────────────────
#   "Which model does X use?"  → This file (role assignment + model def)
#   "What is my API key?"      → .env (secret, gitignored)
#   "How much can I spend?"    → .env (operational runtime control)
#
# ── Model definition fields ───────────────────────────────────────────────────
# Required for all models:
#   id               Model identifier (LM Studio slug or provider model name)
#   context_length   Maximum context window in tokens
#   max_concurrency  Max concurrent in-flight requests
#   default_timeout  Request timeout in seconds
#
# Local-model fields (omit for cloud models):
#   endpoint         Base URL override (defaults to settings.slm_base_url)
#   quantization     e.g. "8bit", "4bit" (omit for cloud models)
#   parallel_tool_calls     Allow multiple tool calls per turn (default true; requires updated llama.cpp)
#   min_concurrency  Floor for adaptive concurrency (ADR-0033)
#
# Cloud-model fields:
#   max_tokens       Max output tokens (billed per token; set deliberately)
#
# Every `kind: llm` entry (ADR-0145 D3a):
#   dialect          Override of the provider's default wire vocabulary. Required
#                    when the provider declares none (see `anthropic:` below).
#   modes            Named sampler/thinking presets, written in the resolved
#                    dialect's own vocabulary — the ONLY home for sampling and
#                    thinking values; there is no top-level fallback. At least
#                    one entry, validated against the dialect's accepted fields
#                    at load.
#   default_mode     Which entry in `modes` a caller gets when it names none.
#
# NOTE: `provider_type` was removed in FRE-916 phase 2 (ADR-0121). Placement is a
# PROVIDER fact, declared once under `providers:` and read via
# ModelConfig.placement_of — it decides dispatch (LocalLLMClient vs LiteLLMClient).
# Concurrency is keyed on the provider's own ceiling, not on this field.

# ── Process-to-model assignments ──────────────────────────────────────────────
# Role assignment lives ONLY in config/model_roles.yaml (ADR-0099 D1 stage 2,
# FRE-650) — entity_extraction/captains_log/insights resolve via
# resolve_role_model_key(), not a header in this file.

# ── Layer 1: Providers (ADR-0121) ────────────────────────────────────────────
# One entry per BACKEND, not per model: endpoint, auth, placement, and the
# total concurrency ceiling. Before ADR-0121 there was no provider entity at
# all — `endpoint` was copy-pasted onto individual model entries and the
# provider was reconstructed at runtime by parsing that URL.
providers:
  slm_local:
    base_url: "https://slm.example.com/v1"
    auth: none
    placement: local
    dialect: llamacpp_qwen  # ADR-0145 D3a; thinking lever chat_template_kwargs.enable_thinking (FRE-1430 F1)
    # 2026-09-04: raised 2 -> 3 to match slm_server's `--parallel 3` on the single
    # served model. At 2 the expansion controller's 4-way fan-out could only ever
    # place 2 sub-agents; the other 2 sat in the client queue and timed out at the
    # then-current 60s per-worker budget without acquiring a slot. Deterministic 50%
    # sub-agent loss, observed live 2026-09-04 03:50.
    # The setting that budget came from (`sub_agent_timeout_seconds`) was deleted by
    # FRE-1381 along with the autonomous path that was its only reader; the observation
    # above still stands, and fan-out is sequential since FRE-1380 (FRE-1400 sweep).
    max_concurrency: 3
    summary: "Owner's Mac GPU via the CF-Access tunnel (llama.cpp + MLX)"
  ovh:
    base_url: "https://oai.endpoints.kepler.ai.cloud.ovh.net/v1"
    auth_env: managed_embedding_token
    placement: cloud
    max_concurrency: 50
    summary: "OVH AI Endpoints — managed embedding inference"
  # Same vendor, same endpoint, same credential as `ovh` above — a SECOND entry
  # rather than a rename, deliberately. The key doubles as litellm's dispatch
  # prefix, and litellm's native provider is spelled `ovhcloud`; but `"ovh"` is
  # also hard-coded as a cost-attribution label in memory/embeddings.py, so
  # renaming the existing key would split OVH spend across two provider names in
  # the ledger and would touch src/ (owner directive: route those through a build
  # seat). Two entries keeps this config-only and keeps each call type's spend
  # attributable. Consolidating them is in scope for the single-call-point study.
  ovhcloud:
    base_url: "https://oai.endpoints.kepler.ai.cloud.ovh.net/v1"
    auth_env: managed_embedding_token
    placement: cloud
    max_concurrency: 50
    summary: "OVH AI Endpoints — managed chat inference (litellm-native provider)"
    dialect: ovh_qwen  # ADR-0145 D3a; reasoning_effort domain {none,low,medium} only (FRE-1430 F3)
  openai:
    auth_env: openai_api_key
    placement: cloud
    max_concurrency: 50
    summary: "OpenAI — structured extraction and compression"
    dialect: openai_gpt5  # ADR-0145 D3a (FRE-1430 F1)
  anthropic:
    auth_env: anthropic_api_key
    placement: cloud
    max_concurrency: 50
    summary: "Anthropic — background reasoning and cloud-profile inference"
    # No provider-level dialect: Sonnet 5 and Haiku 4.5 are two different
    # dialects on one vendor (FRE-1430 F6) — each model below overrides.
  voyage:
    base_url: "https://api.voyageai.com/v1"
    auth_env: voyage_api_key
    placement: cloud
    max_concurrency: 50
    summary: "Voyage AI — managed reranking"

models:
  # ── Tier 1: Primary Agent ───────────────────────────────────────
  qwen3.6-35b-thinking:
    # Orchestrator brain: deep reasoning, tool calling, decomposition planning.
    # Thinking enabled with bounded budget. Single concurrent (GPU-limited).
    # Renamed from "reasoning" (ADR-0033).
    # Sampling per the Qwen3.6-35B-A3B HuggingFace model card,
    # "Thinking Mode — General Tasks" preset. The card requires context >= 128K
    # to preserve thinking capability across multi-turn agent loops.
    provider: slm_local
    # Owner-directed 2026-08-05, second move: rolled back to the 35B after a
    # ~1h trial of the local Qwen3.6-27B-MTP-GGUF. The 27B answered an identity
    # probe correctly but at materially worse latency (66s vs a ~40s median),
    # and the owner reloaded the 35B on the inference server in parallel with
    # this revert. Keeping the catalog key stable across both moves is what
    # made this a one-line change in each direction.
    id: "unsloth/qwen3.6-35-A3B"
    context_length: 262144       # Owner set the backend to the model's full natural window
                                 # 2026-09-05. Read from the server's own /v1/models rather
                                 # than the Qwen card: it reports context_length 262144 on
                                 # port 8502. slm_server runs --kv-unified, which POOLS the KV
                                 # cache across slots instead of partitioning it, so a single
                                 # request may use the whole window — do NOT divide by
                                 # --parallel. (Was 131072, the thinking-mode minimum, which
                                 # understated what the backend actually serves.)
    quantization: "UD-Q6_K_XL"   # reported by /v1/models 2026-09-05 (was "8bit")
    min_concurrency: 1
    # ADR-0145 D1 (FRE-1445): 1 -> 3, the box's real slot count (slm_local's own
    # max_concurrency above), carried from qwen3.6-35b-instruct — the paired
    # deployment this collapse deletes.
    max_concurrency: 3
    default_timeout: 600         # 128K prefill + up to 32K thinking output (was 180)
    # ADR-0145 D3a: sampler/thinking values move into modes:, field for field —
    # no value changes here, only their home. `thinking_budget_tokens` (was
    # 32768) has no home in llamacpp_qwen's dialect and is dropped: it is
    # wire-inert on this server (FRE-1430 F2, FRE-1423), not a lever.
    default_mode: default
    modes:
      default:
        enable_thinking: true   # thinking was on by default (no disable_thinking set)
        temperature: 0.6        # Qwen3.5 carryover; outperforms card's 1.0 on our agent loop (deterministic intent + bounded tool iterations). See EVAL-2026-05-11-subagent-qwen36 COMPARISON.
        top_p: 0.95
        top_k: 20                    # via extra_body
        min_p: 0.0                   # Qwen card recommended; via extra_body
        # 1.5 -> 0.0, owner-directed 2026-08-05 on Unsloth's guidance, which is the
        # authority for this deployment: we run Unsloth's GGUF quant on llama.cpp,
        # and Unsloth recommends presence_penalty 0.0 for thinking mode on BOTH
        # Qwen3.6 sizes. Only the official 35B-A3B card says 1.5, and that value is
        # paired there with temperature 1.0; the 27B card says 0.0. Holding 1.5 next
        # to our temperature 0.6 made this entry a hybrid of two presets that no
        # source recommends together -- a strong repetition penalty tuned for
        # temperature-1.0 sampling, applied to much tighter sampling. With this
        # change the entry is exactly Unsloth's thinking-mode preset for precise
        # tasks: 0.6 / 0.95 / 20 / 0.0 / 0.0 / 1.0. The temperature was already
        # chosen on evidence (EVAL-2026-05-11) and independently matches it.
        presence_penalty: 0.0
        repeat_penalty: 1.0     # llama.cpp's wire name (FRE-1430 F2); was declared as
                                 # `repetition_penalty`, which that server silently ignores
      # ADR-0145 D1 (FRE-1445): the non-thinking preset qwen3.6-35b-instruct carried,
      # preserved here so `sub_agent`'s `mode: worker` binding (inherited onto this
      # entry when it is the selected primary) does not silently strand onto the
      # `default` mode's thinking preset above.
      worker:
        enable_thinking: false
        temperature: 0.7             # Qwen card Instruct preset (was 0.4 for Qwen3.5-9B)
        top_p: 0.80                  # Qwen card Instruct
        top_k: 20
        min_p: 0.0                   # Qwen card Instruct (new)
        presence_penalty: 1.5        # Unsloth + Qwen card, Instruct/non-thinking
        repeat_penalty: 1.0          # llama.cpp's wire name (FRE-1430 F2)
    supports_function_calling: true
    supports_vision: true         # Qwen3.6-35B-A3B vision-capable on the deployed build (ADR-0101)
    supports_pdf_document: false  # No native PDF document block on the local SLM (ADR-0102 §3)
    tool_calling_strategy: "native"  # Qwen3.5/3.6 chat template supports tools natively
    endpoint: "https://slm.example.com/v1"

  qwen3.8-flash-next:
    # Orchestrator brain, replacing qwen3.6-35b-thinking on the owner's swap of
    # 2026-08-28. A NEW catalog key rather than an id-swap under the old one: the
    # August 27B<->35B moves kept `qwen3.6-35b-thinking` stable because both sides
    # were the same family, but a key naming 3.6 while serving a Qwen3.8 (qwen4exp
    # preview) model would mislead every later reader of telemetry. The outgoing
    # entries are retained below, so reverting stays one line in each direction.
    #
    # The MBP holds only one model at this size (87 GiB), so qwen3.6-35-A3B and
    # its -subagent sibling are disabled on the host; `sub_agent` moved to the
    # OVH-managed entry (owner decision 2026-08-28) rather than self-pairing here,
    # which would serialise concurrent HYBRID sub-agents behind this single
    # llama-server at 21 t/s decode.
    #
    # Measured on the box 2026-08-28 (llama-bench, M4 Max, build 90c26fc, 3 reps):
    # pp16384 285 t/s, tg256 21.1 t/s -- against the outgoing qwen3.6-35-A3B Q6_K
    # at 923 / 62.3. ~3x slower per token; whether that costs TURN latency is
    # unmeasured and depends on tokens-per-turn. qwen4exp kernels were two days
    # old at benchmark time.
    provider: slm_local
    id: "unsloth/qwen3.8-flash-next"
    context_length: 131072       # FRE-1427: down from 262144. Per-call max observed under the
                                 # full window was 91.3K (Sept) vs 91.0K under a 131K window
                                 # (Aug) — the larger window bought 0.3K of extra use. Full
                                 # --ctx-size, still. slm_server runs --kv-unified, which POOLS
                                 # the KV cache across slots instead of partitioning it, so a
                                 # single request may use the whole window — do NOT divide by
                                 # --parallel. The real constraint is aggregate KV across
                                 # concurrent requests, which this per-deployment field cannot
                                 # express; concurrent large requests contend for one pool.
    quantization: "UD-IQ4_XS"
    min_concurrency: 1
    # ADR-0145 D1 (FRE-1445): 1 -> 3, the box's real slot count (slm_local's own
    # max_concurrency above), carried from qwen3.8-flash-next-instruct — the
    # paired deployment this collapse deletes.
    max_concurrency: 3
    default_timeout: 600
    # ADR-0145 D3a: sampler/thinking values move into modes:, field for field.
    # `thinking_budget_tokens` (was 32768) has no home in llamacpp_qwen's
    # dialect and is dropped: wire-inert on this server (FRE-1430 F2, FRE-1423).
    default_mode: default
    modes:
      default:
        # Sampling per the Qwen3.8-Flash-Next card, "Thinking Mode" preset. NOT
        # carried over from qwen3.6-35b-thinking's temperature 0.6: that value was
        # chosen on EVAL-2026-05-11 evidence for a different model, and pairing it
        # with this card's other parameters would rebuild exactly the two-preset
        # hybrid this file records fixing on 2026-08-05.
        enable_thinking: true   # thinking was on by default (no disable_thinking set)
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 0.0
        repeat_penalty: 1.0     # llama.cpp's wire name (FRE-1430 F2); was `repetition_penalty`
      # ADR-0145 D1 (FRE-1445): the non-thinking preset qwen3.8-flash-next-instruct
      # carried, preserved here so `sub_agent`'s `mode: worker` binding (inherited
      # onto this entry, the currently served primary) does not silently strand
      # onto the `default` mode's thinking preset above.
      worker:
        enable_thinking: false  # was disable_thinking: true — hard disable via chat_template_kwargs (ADR-0023)
        temperature: 0.7
        top_p: 0.8
        top_k: 20
        min_p: 0.0
        presence_penalty: 1.5
        repeat_penalty: 1.0     # llama.cpp's wire name (FRE-1430 F2); was `repetition_penalty`
    supports_function_calling: true
    supports_vision: true         # SLM catalog reports model_type: multimodal
    supports_pdf_document: false  # No native PDF document block on the local SLM (ADR-0102 §3)
    tool_calling_strategy: "native"
    endpoint: "https://slm.example.com/v1"

  # ── Managed Qwen (OVH AI Endpoints) ─────────────────────────────
  qwen3.8-27b-ovh:
    # Owner-directed 2026-08-05, moved to the 3.8 generation 2026-09-06 at the
    # owner's request. Managed Qwen hosted by OVH instead of on the owner's Mac
    # — a SELECTABLE alternative, not a bound role. No role binds this key; it
    # appears in the PWA model picker because the primary binding is
    # `open: true` and role_candidates offers every available llm-kind
    # deployment.
    #
    # Motivation: the local 27B trial measured 66s on a single turn against a
    # ~40s median for the local 35B. The managed copy is expected to be
    # materially faster; this entry is what makes that comparable rather than
    # asserted.
    #
    # No api_base is needed: litellm ships a native `ovhcloud` provider whose
    # default base URL is byte-identical to the one declared above, so dispatch
    # is `ovhcloud/Qwen3.8-27B` and the pricing registry keys on the same string.
    provider: ovhcloud
    id: "Qwen3.8-27B"
    # Provider truth, read from OVH's own model record rather than assumed.
    #
    # The 262144 window is NOT reachable today, and that is worth knowing before
    # anyone plans around it. Two ceilings bind first and both are below it:
    # `conversation_max_history_messages` (20, FRE-1427) slices session history
    # in the hydration phase, before the gateway pipeline runs at all, so
    # occupancy cannot grow; and `context_window_max_tokens` (48000, FRE-1427)
    # is a single GLOBAL budget, not per-model. Using a larger window needs the window policy
    # decided AND that global ceiling made per-model -- a design change, not a
    # config edit. Declared as provider truth regardless, so the catalog does
    # not lie about the model.
    context_length: 262144
    # NOT provider truth, and cannot be: OVH counts requested OUTPUT tokens
    # against the context window, so max_tokens 262144 leaves zero room for
    # input and every call fails 400 before it starts -- observed live
    # 2026-08-05 ("you requested 262144 output tokens ... which is the upper
    # bound for 0 input tokens"). context_length and max_completion_tokens both
    # reading 262144 in OVH's model record does not mean both can be requested;
    # they share one budget. 32768 matches the local primary's thinking budget
    # and leaves 229376 for input. It also bounds the cost exposure -- thinking
    # bills as completion here and extra_body cannot reach this path to cap it.
    max_tokens: 32768
    # 25 of the provider's 50 ceiling, against the local primary's single GPU
    # slot. This is the axis with immediate value: prompt-level defects are
    # model-portable (FRE-1150 reproduced identically on three model families),
    # so prompt-behaviour evals can fan out here instead of serialising on the
    # one local slot.
    max_concurrency: 25
    default_timeout: 300
    # NOT copied from OVH's model record, and this is the one place the 3.8
    # entry departs from "provider truth" -- deliberately, with the reason
    # stated so a later reader does not "correct" it back.
    #
    # Read live 2026-09-06, the Qwen3.8-27B record reports pricing.prompt "0"
    # and pricing.completion "0", while the model's own catalog page quotes
    # EUR 0.4 /Mtok input and EUR 2.7 /Mtok output. The record was created
    # 2026-09-03, so the zeros are far more likely an unpopulated launch-window
    # record than a genuinely free model. Copying them would make every call
    # bill at zero, which hides real spend from the cost gate -- the exact
    # "silently register as zero" failure the outgoing entry's own comment
    # warned about for a different reason.
    #
    # The declared values are carried forward from Qwen3.6-27B, which is sound
    # arithmetic rather than a guess: that model's page quotes the SAME
    # EUR 0.4 / EUR 2.7, and its populated record reports USD 0.00000047 /
    # 0.00000319 -- an implied rate of ~1.18 applied to both figures. Same list
    # price in, same conversion out.
    #
    # This fails SAFE. If the model really is free for now, the budget gate
    # reserves more than it spends. Re-read the record once OVH populates it,
    # and replace these with provider truth.
    input_cost_per_token: 0.00000047     # $0.47/MTok (EUR 0.4 at the 3.6 entry's rate)
    output_cost_per_token: 0.00000319    # $3.19/MTok (EUR 2.7 at the 3.6 entry's rate)
    # 1.0 is the model card's THINKING-mode value, and thinking mode is the one
    # this deployment actually runs in.
    #
    # Card values, read 2026-09-06 from huggingface.co/Qwen/Qwen3.8-27B:
    #   thinking  temperature 1.0, top_p 0.95, top_k 20, min_p 0.0, presence_penalty 0.0
    #   instruct  temperature 0.7, top_p 0.80, top_k 20, min_p 0.0, presence_penalty 1.5
    #
    # This SUPERSEDES the outgoing 0.6, which was owner-directed 2026-08-05 as
    # "a good starting point" chosen to match the then-local primary rather than
    # read from a card.
    #
    # temperature stays the ONLY sampling value declared, because it is the
    # only one ovh_qwen's dialect actually reaches: top_p, top_k, min_p and
    # presence_penalty are declared on the card but are not in this entry,
    # rather than declared-but-inert (ADR-0145 D3a; FRE-1430 F1/F5 measured the
    # accepted set). Choosing a cheap worker mode is D6, a separate decision.
    #
    # FRE-1441 (ADR-0145 D3b): `reasoning_effort` was previously undeclared here,
    # so OVH's own gateway default (`xhigh`, unrequestable — FRE-1430 F3) applied
    # by omission rather than by anyone's choice — exactly the FRE-1007 gap this
    # deployment was passing unnoticed, because no binding names this key and
    # the guard walked only bound deployments. `medium` is the closest legal
    # value to the thinking-mode intent above: ovh_qwen's domain is
    # {none, low, medium} only (`high` 400s, `xhigh` 422s, FRE-1430 F3), and it
    # is also cheaper — ADR-0145 D6 measured `xhigh` at 2.2x `medium`'s total
    # cost.
    default_mode: default
    modes:
      default:
        temperature: 1.0
        reasoning_effort: medium
    # PROVENANCE WARNING for the three capability flags below. OVH's models
    # endpoint returns exactly seven keys -- id, created, object, owned_by,
    # pricing, context_length, max_completion_tokens -- and no capability
    # information at all, on either the list or the per-model path. So every
    # NUMBER above is read from the provider; these three flags are not, and
    # come from the OVH console. Verify them there when adding an OVH model
    # rather than inferring, which is how supports_vision was first set wrong.
    supports_function_calling: true
    tool_calling_strategy: "native"
    # OVH's own catalog page for Qwen3.8-27B lists Supported Features as
    # Function calling, Multimodal, Reasoning and Streaming, with output
    # formats raw_text / json_object / json_schema -- the identical set the
    # console listed for Qwen3.6-27B, read 2026-09-06. Multimodal is what
    # licenses `true` here. Confirm in the console if a vision turn misbehaves:
    # this flag is the one that was first set wrong by inferring.
    supports_vision: true
    supports_pdf_document: false

  # ── Cloud Models (ADR-0031) ─────────────────────────────────────
  # API key is NOT stored here — set AGENT_ANTHROPIC_API_KEY / AGENT_OPENAI_API_KEY in .env

  claude_sonnet:
    # Anthropic Claude Sonnet — used for background reasoning tasks
    # (entity extraction, Captain's Log reflection, insights analysis)
    # LiteLLM model string: "anthropic/claude-sonnet-5" (prefixed at call time)
    id: "claude-sonnet-5"
    provider: "anthropic"
    dialect: anthropic_adaptive  # ADR-0145 D3a — provider declares no default (FRE-1430 F6)
    max_tokens: 128000        # provider ceiling; policy clamp is settings.artifact_draft_max_tokens
    context_length: 200000
    # FRE-1007: MANDATORY for a role-bound llm deployment — config_guard's
    # check_reasoning_declaration refuses to boot without it. Omission is not
    # "the default": it means nobody chose, and the provider's own default
    # applies at call time. Every producer bound here (captains_log,
    # session_summary, insights, artifact_builder, vision) was inheriting
    # exactly that.
    #
    # `high` is DECLARED, not tuned: it is the value these calls were already
    # silently receiving, so this states the choice without changing behaviour.
    # Measured against litellm 1.89.2 -> {"thinking": {"type": "adaptive"},
    # "output_config": {"effort": "high"}}. Tuning a cheaper depth for the
    # digest's faithfulness task is FRE-993's, per FRE-1007's RELATED section.
    #
    # ADR-0145 D3a: moved into modes: below, field for field — `reasoning_effort:
    # high` becomes `effort: high`, anthropic_adaptive's own lever name.
    default_mode: default
    modes:
      default:
        effort: high
    min_concurrency: 1
    max_concurrency: 10
    default_timeout: 180
    supports_vision: true         # Claude Sonnet is vision-capable (ADR-0101)
    supports_pdf_document: true   # Claude Sonnet accepts the native PDF document block (ADR-0102 §3)
    input_cost_per_token: 0.000003    # $3/MTok (ADR-0101 §8b / FRE-691 — config-owned cost matrix)
    output_cost_per_token: 0.000015   # $15/MTok

  claude_haiku:
    # Anthropic Claude Haiku — fast, low-cost sub-agent model for cloud profile
    # Used as sub_agent_model in config/profiles/cloud.yaml
    id: "claude-haiku-4-5-20251001"
    provider: "anthropic"
    dialect: anthropic_budget  # ADR-0145 D3a — no adaptive thinking, no effort (FRE-1430 F6)
    max_tokens: 64000         # provider ceiling; policy clamp is settings.artifact_draft_max_tokens
    context_length: 200000
    min_concurrency: 1
    max_concurrency: 20
    default_timeout: 30
    # ADR-0145 D3a: no sampler/thinking value was declared before this migration
    # (none reaches this producer today), so the default mode stays empty —
    # behaviour-preserving, not a new choice.
    default_mode: default
    modes:
      default: {}
    supports_vision: true         # Claude Haiku is vision-capable (ADR-0101)
    supports_pdf_document: true   # Claude Haiku accepts the native PDF document block (ADR-0102 §3)
    input_cost_per_token: 0.000001    # $1/MTok (ADR-0101 §8b / FRE-691 — config-owned cost matrix)
    output_cost_per_token: 0.000005   # $5/MTok


  gpt-5.4-mini:
    # OpenAI GPT-5.4 Mini — higher-quality background reasoning
    # Pricing: $0.75/$4.50 per MTok (input/output)
    id: "gpt-5.4-mini"
    provider: "openai"
    max_tokens: 8192
    context_length: 128000
    min_concurrency: 1
    max_concurrency: 10
    default_timeout: 60
    # FRE-758/FRE-649: the local entity_extraction_role (top of file), matching
    # the prod entity extractor (the two catalogs agreed here before FRE-916
    # phase 2 collapsed them into this file).
    #
    # FRE-1007: MANDATORY declaration (see claude_sonnet above). `none` is the
    # DELIBERATE no-reasoning choice, and it is the only value this deployment
    # can carry — both facts are measured, not assumed:
    #
    #  1. Behaviour-preserving. scripts/eval/fre630_extraction_quality/cells.py
    #     measured 2026-07-03 that gpt-5.4-mini with the hint unset produces ZERO
    #     reasoning tokens, identical to explicit 'none'. (FRE-1007's own premise
    #     that the GPT-5 default is 'medium' is wrong; that eval is the evidence.)
    #  2. Any HIGHER value would be an outage, not a cost change. litellm rejects
    #     temperature != 1 together with any effort above 'none' on the gpt-5
    #     family, and `temperature: 0.0` below is the FRE-758 pin. Measured
    #     against litellm 1.89.2: reasoning_effort='medium' + temperature=0.0 ->
    #     UnsupportedParamsError. entity_extraction and compressor both bind here.
    #
    # 'none' reaching the wire as a real parameter (reasoning_effort: "none") is
    # what makes this a declaration rather than a silence — the guard verifies
    # exactly that, and rejects the same value on Anthropic where it is dropped.
    # ADR-0145 D3a moved both values into modes: below, field for field.
    default_mode: default
    modes:
      default:
        temperature: 0.0
        reasoning_effort: none
    input_cost_per_token: 0.00000075    # $0.75/MTok (ADR-0101 §8b / FRE-742 — config-owned cost matrix)
    output_cost_per_token: 0.0000045    # $4.50/MTok


  # ── Embedding Model (Seshat Memory — ADR-0035) ─────────────────
  embedding:
    kind: embedding
    # Qwen3-Embedding-8B on OVH AI Endpoints (ADR-0112 D4/AC-5). Replaces the
    # retired local 0.6B. Instruction-aware, Matryoshka: truncated to 1024 dims,
    # the measured sweet spot — nDCG@5 peaks there, beating native 4096 (FRE-826).
    # One-way door: changing this model requires rebuilding every Neo4j vector.
    provider: ovh
    id: "Qwen3-Embedding-8B"
    dimensions: 1024
    endpoint: "https://oai.endpoints.kepler.ai.cloud.ovh.net/v1"
    context_length: 32768
    # Was 1, inherited from the local 0.6B llama.cpp container this replaced
    # (48ae7529, localhost:8503) where single-request-at-a-time was literally
    # true. Against a managed API it was drift; the provider ceiling governs.
    max_concurrency: 50
    default_timeout: 60
    supports_function_calling: false
    input_cost_per_token_eur: 0.0000001    # €0.10/MTok (FRE-974 — OVH AI Endpoints catalog, 2026-07-24)

  # ── Reranker Model (Seshat Memory — ADR-0035) ──────────────────
  reranker:
    kind: reranker
    # Voyage rerank-2.5 — managed reranker API (FRE-851). PRIMARY: ~250ms,
    # quality-equivalent to the Mac 4B (FRE-695 J=0.73 vs 0.747, inside n=54
    # noise). Falls back to reranker_fallback (Mac-tunnel 4B) on error/timeout,
    # then to passthrough on total failure (memory/reranker.py).
    provider: voyage
    id: "rerank-2.5"
    endpoint: "https://api.voyageai.com/v1"
    context_length: 32000
    max_concurrency: 5
    default_timeout: 30
    supports_function_calling: false
    input_cost_per_token: 0.00000005    # $0.05/MTok (FRE-974 — docs.voyageai.com/docs/pricing, 2026-07-24)

  # ── Reranker Fallback Model (FRE-851) ───────────────────────────
  reranker_fallback:
    kind: reranker
    # Qwen3-Reranker-4B mxfp8 on the Mac/laptop GPU via slm.example.com,
    # MLX runtime (FRE-696). Programmatic fallback target when Voyage
    # (the "reranker" role) errors or times out — memory/reranker.py tries
    # this before degrading to passthrough.
    provider: slm_local
    id: "Qwen/Qwen3-Reranker-4B-mxfp8"
    endpoint: "https://slm.example.com/v1"
    context_length: 8192
    max_concurrency: 1
    default_timeout: 120
    supports_function_calling: false

