# Cloud Deployment Docker Compose
#
# Production topology for the Seshat API Gateway and supporting services.
# Resource limits are conservative; VPS-3 (24GB RAM, 8 vCPU) provides headroom.
#
# Services:
# - PostgreSQL (pgvector): 512MB RAM, 1.0 CPU (ADR-0105 D8/FRE-718 — raised from 0.5 CPU;
#   cgroup cpu.stat showed it was the most CPU-throttled container on the host)
# - Neo4j Community: 1536MB RAM, 1.0 CPU
# - Elasticsearch: 2048MB RAM, 1.0 CPU
# - Kibana: 1024MB RAM, 0.5 CPU
# - Redis: 128MB RAM, 0.25 CPU
# - Seshat API Gateway: 256MB RAM, 0.5 CPU
# - Caddy reverse proxy: 64MB RAM, 0.25 CPU
#
# Network: cloud-sim (isolated bridge network)
# All services communicate via internal DNS. Debug ports are bound to 127.0.0.1
# only (SSH tunnel to access). Only Caddy exposes 80 and 443 externally.

services:
  # PostgreSQL 17 with pgvector extension
  # Purpose: Sessions, metrics, conversation history, embeddings
  # Resource limit: 512MB RAM, 1.0 CPU
  #
  # Tuning (ADR-0105 D8/AC-7, FRE-718) — verified-live against this exact container before
  # changing anything (mem_limit=512MB confirmed via docker inspect; stock defaults confirmed
  # via SHOW; CPU throttling confirmed via cgroup cpu.stat: ~6.9% of scheduling periods
  # throttled, ~19% of used CPU time lost to throttling — the worst of every container on the
  # host):
  #   - random_page_cost / effective_io_concurrency / track_io_timing: SSD-appropriate planner
  #     costs (memory-neutral, correct on the SSD-backed host regardless of container size).
  #   - max_parallel_workers_per_gather=0: Postgres auto-detects the HOST's 8 CPUs (Docker CPU
  #     quotas don't hide /proc/cpuinfo without an explicit cpuset) and sizes per-query
  #     parallelism for cores it never actually gets scheduled on; zeroing it avoids
  #     context-switch overhead for zero benefit on this shallow-traversal workload.
  #   - shared_preload_libraries=pg_stat_statements: the standard query-performance-auditing
  #     extension, not enabled today. Requires a restart to take effect (can't be `-c`'d at
  #     runtime), so it rides this same restart rather than requiring a second one later. Run
  #     `CREATE EXTENSION IF NOT EXISTS pg_stat_statements;` once after the restart.
  #   - effective_cache_size=384MB (75% of the real 512MB limit): replaces the stock 4GB
  #     default, which is 8x the container's entire memory ceiling and skews planner cost
  #     estimates. shared_buffers stays at 128MB (25% of 512MB) — already correct, made
  #     explicit rather than an accidental match with the stock default.
  #   - work_mem is deliberately left at the stock 4MB (no bump): work_mem x max_connections
  #     (100) could demand up to 800MB in the worst case, 1.5x this container's memory limit —
  #     an OOM-kill risk on a live shared database not worth the modest recursive-CTE-sort gain.
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cloud-sim-postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required — set in .env}
      POSTGRES_DB: personal_agent
    command:
      - postgres
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - track_io_timing=on
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
    volumes:
      - postgres_data_cloud:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      # Localhost only — use SSH tunnel to access: ssh -L 5432:localhost:5432 <your-vps-ssh-alias>
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d personal_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0
    networks:
      - cloud-sim
    restart: unless-stopped

  # Neo4j 5.26 Community Edition
  # Purpose: Knowledge graph, entity relationships, memory consolidation
  # Resource limit: 1536MB RAM, 1.0 CPU
  # Heap: 1GB max, pagecache: 256MB
  neo4j:
    image: neo4j:5.26-community
    container_name: cloud-sim-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD required — set in .env}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"
      # Memory configuration for cloud footprint
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 256m
      # Bolt advertised address — tells the Browser to connect via the public hostname
      # so Bolt-over-WebSocket routes through Cloudflare Tunnel (port 443 → neo4j:7474)
      # instead of trying localhost:7687 from the user's browser. Real value from
      # .env's NEO4J_ADVERTISED_ADDRESS (FRE-895); placeholder here is inert.
      NEO4J_server_bolt_advertised__address: ${NEO4J_ADVERTISED_ADDRESS:-graph.example.com:443}
    volumes:
      - neo4j_data_cloud:/data
    ports:
      # Localhost only — use SSH tunnel: ssh -L 7474:localhost:7474 -L 7687:localhost:7687 <your-vps-ssh-alias>
      - "127.0.0.1:7474:7474"  # HTTP Browser
      - "127.0.0.1:7687:7687"  # Bolt Driver
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 1536m
    cpus: 1.0
    networks:
      - cloud-sim
    restart: unless-stopped

  # Elasticsearch 8.19
  # Purpose: Logs, traces, indexed knowledge, telemetry
  # Resource limit: 2048MB RAM, 1.0 CPU
  # JVM heap: 512MB min, 1GB max
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: cloud-sim-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Tight JVM memory constraints for cloud footprint
      - "ES_JAVA_OPTS=-Xms512m -Xmx1g"
    volumes:
      - es_data_cloud:/usr/share/elasticsearch/data
    ports:
      # Localhost only — use SSH tunnel: ssh -L 9200:localhost:9200 <your-vps-ssh-alias>
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 2048m
    cpus: 1.0
    networks:
      - cloud-sim
    restart: unless-stopped

  # Kibana 8.19 — log/trace dashboards behind a monitoring.<domain> Cloudflare Tunnel host
  # Purpose: Dashboard UI for Elasticsearch telemetry (agent logs, Captain's Log, insights)
  # Access: CF Zero Trust backend_admin policy (lextra@gmail.com only, 1h session)
  # Tunnel: monitoring.<domain> → http://kibana:5601 (bypasses Caddy)
  # Resource limit: 1024MB RAM, 0.5 CPU
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    container_name: cloud-sim-kibana
    # ADR-0134: the saved-objects encryption key (required for alerting/actions APIs)
    # lives HERE and only here. A separate file from /opt/seshat/.env precisely because
    # the gateway imports that one wholesale via env_file — a shared file would put an
    # unrelated secret in the application process for no reason, same problem ADR-0132
    # D1 solved for the Cloudflare Access pair below. required: false so a host without
    # the file (a fresh clone, CI running `compose config`, a deployment that hasn't
    # enabled alerting) still parses. A missing file is not silent: Kibana's own startup
    # log emits the encryptedSavedObjects/actions/alerting disabled-key warnings, and
    # the actions API returns HTTP 500 — a visible failure, not a broken compose command.
    env_file:
      - path: /opt/seshat/.env.kibana
        required: false
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - TELEMETRY_OPTIN=false
    volumes:
      - ./docker/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      # Localhost only — use SSH tunnel: ssh -L 5601:localhost:5601 <your-vps-ssh-alias>
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1024m
    cpus: 0.5
    networks:
      - cloud-sim
    restart: unless-stopped

  # Tempo 2.10.7 — trace storage/query backend (ADR-0129 D6). Internal only, no tunnel host —
  # Grafana is the UI; nothing external talks to Tempo directly. No Docker healthcheck: the
  # image is distroless (no shell, no wget, no self-check flag — verified live) so no
  # in-container check is possible; Grafana depends on the container having started, not a
  # health condition.
  # Resource limit: 512MB RAM, 0.5 CPU
  tempo:
    image: grafana/tempo:2.10.7
    container_name: cloud-sim-tempo
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data_cloud:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]
    mem_limit: 512m
    cpus: 0.5
    networks:
      - cloud-sim
    restart: unless-stopped

  # Grafana 13.1.3 — trace/log visualization UI behind an observe Cloudflare Tunnel host
  # Purpose: Dashboard UI for Tempo traces + Elasticsearch logs (ADR-0129 D6). Kibana is
  # retained, not replaced — see the kibana block above and ADR-0129 D6's 2026-08-07 amendment.
  # Access: CF Zero Trust backend_admin policy, scoped to the owner alone (runbook action, not
  # decided in this repo — ADR-0129 D6's own AC-10 text)
  # Tunnel: observe → http://grafana:3000 (bypasses Caddy, follows Kibana's topology, not Caddy's)
  # Resource limit: 512MB RAM, 0.5 CPU
  grafana:
    image: grafana/grafana:13.1.3
    container_name: cloud-sim-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=true
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required — set in .env}
      - GF_SERVER_ROUTER_LOGGING=true
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data_cloud:/var/lib/grafana
    ports:
      # Localhost only — use SSH tunnel: ssh -L ${GRAFANA_HOST_PORT:-3001}:localhost:${GRAFANA_HOST_PORT:-3001} <your-vps-ssh-alias>
      # Host port is env-overridable (default 3001, see GRAFANA_HOST_PORT in .env.example):
      # no port chosen inside this repo can be known-safe on an arbitrary host — 3000 collided
      # with seshat-pwa, 3001 collided with an orphaned next-server dev process, both live
      # incidents (2026-08-07). The host, not the repo, knows what's actually free. Container
      # port stays 3000 — the Cloudflare Tunnel reaches Grafana on the compose network at
      # http://grafana:3000, unaffected by this host-side binding.
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    depends_on:
      tempo:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - cloud-sim
    restart: unless-stopped

  # Redis 7 (Alpine)
  # Purpose: Event bus (Redis Streams), session cache, rate limiting
  # Resource limit: 128MB RAM, 0.25 CPU
  redis:
    image: redis:7-alpine
    container_name: cloud-sim-redis
    ports:
      # Localhost only — use SSH tunnel: ssh -L 6379:localhost:6379 <your-vps-ssh-alias>
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data_cloud:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 128m
    cpus: 0.25
    networks:
      - cloud-sim
    restart: unless-stopped
    command: redis-server --appendonly yes

  # SearXNG metasearch engine for private web search (ADR-0034)
  # Purpose: Private web search aggregating Google, Brave, DuckDuckGo, etc.
  # Resource limit: 256MB RAM, 0.5 CPU
  searxng:
    image: searxng/searxng:latest
    container_name: cloud-sim-searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    ports:
      # Localhost only — use SSH tunnel: ssh -L 8888:localhost:8888 <your-vps-ssh-alias>
      - "127.0.0.1:8888:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    networks:
      - cloud-sim
    restart: unless-stopped

  # Seshat API Gateway (FastAPI)
  # Purpose: Full agent harness — Knowledge API, Observation API, orchestration
  # Depends on: postgres, neo4j, elasticsearch, redis, searxng
  # Resource limit: 512MB RAM, 1.0 CPU (increased for full harness)
  seshat-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: cloud-sim-seshat-gateway
    # env_file passes ALL vars from .env into the container.
    # New feature flags and secrets only need to be set in .env — no compose change required.
    # The environment: block below overrides only vars that must differ inside Docker
    # (internal hostnames, Docker-specific paths, hardcoded production values).
    # Docker Compose precedence: environment: > env_file: — so overrides always win.
    env_file:
      - /opt/seshat/.env
    environment:
      # ── Docker-internal service URLs (override .env localhost values) ──────────
      # App connects as the restricted non-superuser `seshat_app` role (FRE-808);
      # it has no access to schema sysgraph. Set SESHAT_APP_PASSWORD in .env and
      # run `ALTER ROLE seshat_app PASSWORD …` on the DB to match (migration 0015).
      AGENT_DATABASE_URL: postgresql+asyncpg://seshat_app:${SESHAT_APP_PASSWORD:?SESHAT_APP_PASSWORD required — set in .env}@postgres:5432/personal_agent
      # Superuser handle for migrations / admin DDL only — never used by the
      # request path (FRE-808).
      AGENT_DATABASE_ADMIN_URL: postgresql+asyncpg://agent:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required — set in .env}@postgres:5432/personal_agent
      AGENT_NEO4J_URI: bolt://neo4j:7687
      AGENT_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD required — set in .env}
      AGENT_ELASTICSEARCH_URL: http://elasticsearch:9200
      AGENT_EVENT_BUS_REDIS_URL: redis://redis:6379/0
      AGENT_SEARXNG_BASE_URL: http://searxng:8080
      # ── Docker-specific paths and hardcoded production values ─────────────────
      AGENT_MCP_GATEWAY_COMMAND: '["/app/docker/mcp/run-gateway.sh"]'
      AGENT_DEPLOYMENT_PROFILE: cloud
      MCP_SECRETS_FILE: /opt/seshat/mcp-secrets.env
      AGENT_GATEWAY_AUTH_ENABLED: "true"
      API_HOST: 0.0.0.0
      API_PORT: "9001"
      APP_ENV: production
      # ── Outbound egress (ADR-0132 D1) ────────────────────────────────────────
      # The Cloudflare Access service-token pair is deliberately ABSENT here. It
      # now lives only in the caddy service's own env file; this service
      # addresses the internal Caddy egress blocks and Caddy injects the
      # credential. Re-adding CF_ACCESS_* here would undo the custody move.
      # NOTE: the pair must also be REMOVED from /opt/seshat/.env — env_file
      # above imports that whole file, so leaving it there puts it back
      # in-process and makes the move cosmetic.
      AGENT_SLM_BASE_URL: http://caddy:8600
      AGENT_ARTIFACTS_EGRESS_BASE_URL: http://caddy:8601
    ports:
      # Localhost only — Caddy proxies to this port internally
      - "127.0.0.1:9001:9001"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    volumes:
      # Docker socket — allows run-gateway.sh to spawn docker/mcp-gateway container
      - /var/run/docker.sock:/var/run/docker.sock
      # FRE-910: durable-by-default parent mount. Every Path("telemetry/...") writer
      # in src (nine today, any future one) lands under a mounted path automatically —
      # no more one-mount-per-writer whack-a-mole. The nested volumes below stay
      # mounted at their specific subpaths: Docker mounts by path depth, so a
      # more-specific mount keeps owning its subtree and existing data — nothing moves.
      - seshat_telemetry_cloud:/app/telemetry
      # Persist Captain's Log (CL-*.json reflections + captures/) across restarts.
      # The parent mount covers both reflection files and the captures/ subdirectory.
      # seshat_captures_cloud (legacy, captures/ only) superseded by this volume.
      - seshat_captains_log_cloud:/app/telemetry/captains_log
      # ADR-0054: feedback_history/ and poller state must survive container restarts.
      # feedback_history_dir() → /app/telemetry/feedback_history (disk-durable records)
      # poller_state_path()   → /app/telemetry/feedback_poller_state.json (at-most-once dedup)
      - seshat_feedback_history_cloud:/app/telemetry/feedback_history
      # ADR-0054: the durable JSONL leg of the Wave-3 self-improvement streams must
      # survive container recreation (FRE-598). Without these the *.jsonl dual-write
      # lives only in the ephemeral container layer (lost on rebuild). Data also lands
      # in Redis + ES, but the on-disk JSONL is the ADR-0054 durable source of truth.
      - seshat_graph_quality_cloud:/app/telemetry/graph_quality       # ADR-0060 Stream 8
      - seshat_context_quality_cloud:/app/telemetry/context_quality   # ADR-0059
      - seshat_error_patterns_cloud:/app/telemetry/error_patterns     # ADR-0056
      - seshat_freshness_review_cloud:/app/telemetry/freshness_review  # ADR-0060 Stream 6
      # Shared workspace volume for run_python sandbox scratch dirs.
      # Mounted at the same path used by AGENT_SANDBOX_SCRATCH_ROOT.
      - seshat_workspace_cloud:/app/agent_workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Wait for ES and Neo4j to accept connections before starting uvicorn.
    # depends_on health checks only run on `docker compose up`, not on
    # restart: unless-stopped triggered restarts (e.g. after a dep bounces).
    # This loop re-checks on every container start so the gap cannot recur.
    command:
      - sh
      - -c
      - |
        until curl -sf http://elasticsearch:9200/_cluster/health -o /dev/null; do
          echo 'waiting for elasticsearch...' && sleep 3
        done
        until curl -sf http://neo4j:7474 -o /dev/null; do
          echo 'waiting for neo4j...' && sleep 3
        done
        exec uv run uvicorn personal_agent.service.app:app --host 0.0.0.0 --port 9001
    mem_limit: 2g
    cpus: 1.0
    networks:
      - cloud-sim
    restart: unless-stopped

  # Seshat PWA (Next.js)
  # Purpose: Mobile-first chat UI served via Caddy
  # SESHAT_URL and GATEWAY_TOKEN are runtime env vars — image is portable (FRE-339).
  # Resource limit: 256MB RAM, 0.5 CPU
  seshat-pwa:
    build:
      context: .
      dockerfile: Dockerfile.pwa
      args:
        NEXT_PUBLIC_ARTIFACTS_HOST: ${NEXT_PUBLIC_ARTIFACTS_HOST:-artifacts.example.com}
    environment:
      SESHAT_URL: ${SESHAT_URL:-https://agent.example.com}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN_PWA}
    container_name: cloud-sim-seshat-pwa
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      seshat-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 256m
    cpus: 0.5
    networks:
      cloud-sim:
        ipv4_address: 172.25.0.11
    restart: unless-stopped

  # Caddy reverse proxy
  # Purpose: TLS termination (localhost SSH access) + HTTP entry point (WARP private network)
  # Resource limit: 64MB RAM, 0.25 CPU
  # Static IP 172.25.0.10 — stable address for WARP private network routing
  caddy:
    image: caddy:2-alpine
    container_name: cloud-sim-caddy
    # ADR-0132 D1: the Cloudflare Access service-token pair lives HERE and only
    # here. A separate file from /opt/seshat/.env precisely because the gateway
    # imports that one wholesale via env_file — a shared file would leave the
    # credential in the application process and make the custody move cosmetic.
    # required: false so a host without the file (a fresh clone, CI running
    # `compose config`, a deployment with no Cloudflare barrier) still parses.
    # A missing file is not silent: the egress blocks then send empty CF headers,
    # Cloudflare answers 403, and the SLM health probe reports down with a hint
    # naming this file — a visible failure rather than a broken compose command
    # for everyone.
    env_file:
      - path: /opt/seshat/.env.caddy
        required: false
    environment:
      AGENT_HOST: ${AGENT_HOST:-agent.example.com}
      GRAPH_HOST: ${GRAPH_HOST:-graph.example.com}
      ES_HOST: ${ES_HOST:-es.example.com}
      API_HOST: ${API_HOST:-api.example.com}
      # Outbound egress upstreams (ADR-0132 D1). Real hosts come from .env;
      # tracked source ships inert placeholders (FRE-895).
      SLM_HOST: ${SLM_HOST:-slm.example.com}
      ARTIFACTS_HOST: ${ARTIFACTS_HOST:-artifacts.example.com}
    ports:
      - "80:80"
      - "443:443"
      # Outbound egress listeners (ADR-0132 D1), bound to LOOPBACK ONLY.
      # Not exposed off-box: this exists so host-side tooling (eval scripts,
      # `uv run agent`) keeps a route to the SLM. Before this change those
      # scripts reached the tunnel directly using CF headers from /opt/seshat/.env;
      # that credential now lives only in the caddy container, so without a
      # loopback route they would have no path at all.
      - "127.0.0.1:8600:8600"
      - "127.0.0.1:8601:8601"
    volumes:
      - ./config/cloud-sim/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      seshat-gateway:
        condition: service_healthy
      seshat-pwa:
        condition: service_healthy
    healthcheck:
      # Caddy admin API (port 2019) — avoids TLS cert issues in healthcheck
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 64m
    cpus: 0.25
    networks:
      cloud-sim:
        ipv4_address: 172.25.0.12
    restart: unless-stopped

  # Filebeat sidecar — ships cloud-sim-caddy's access logs to caddy-access-*
  # (FRE-1146 / ADR-0132 D3). Resolves caddy's container ID itself at startup
  # (see Dockerfile.filebeat / config/filebeat/resolve-caddy-container.sh) by
  # reading config.v2.json under the read-only containers mount below —
  # deliberately NOT /var/run/docker.sock, which would grant full Docker
  # Engine API access (host-mount container creation) rather than the
  # read-only log access this sidecar actually needs.
  filebeat:
    build:
      context: .
      dockerfile: Dockerfile.filebeat
    container_name: cloud-sim-filebeat
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - filebeat_registry_cloud:/usr/share/filebeat/data
    depends_on:
      caddy:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      # Filebeat exposes no HTTP endpoint by default; confirm the resolved
      # entrypoint actually exec'd into the filebeat process (PID 1).
      test: ["CMD-SHELL", "grep -q filebeat /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cloud-sim
    restart: unless-stopped

  # Cloudflare Tunnel — WARP private network access
  # Purpose: Connects VPS Docker network to Cloudflare Zero Trust
  # WARP devices route 172.25.0.0/16 through this tunnel → reach Caddy at 172.25.0.10
  # Token stored in .env as CLOUDFLARE_TUNNEL_TOKEN (never committed)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloud-sim-cloudflared
    # Force HTTP/2 over TCP — QUIC (UDP) is blocked by some datacentre firewalls
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - cloud-sim
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_healthy

volumes:
  # PostgreSQL data (persisted)
  postgres_data_cloud:
    driver: local

  # Neo4j data (persisted)
  neo4j_data_cloud:
    driver: local

  # Elasticsearch data (persisted)
  es_data_cloud:
    driver: local

  # Tempo trace blocks (persisted)
  tempo_data_cloud:
    driver: local

  # Grafana's own state — org, users, provisioned-object bookkeeping (persisted)
  grafana_data_cloud:
    driver: local

  # Redis data (persisted)
  redis_data_cloud:
    driver: local

  # Caddy data and config (persisted)
  caddy_data:
    driver: local
  caddy_config:
    driver: local

  # Filebeat's filestream registry (FRE-1146 / ADR-0132 D3) — persists read
  # offsets across a `docker compose restart filebeat` so already-shipped
  # caddy-access-* lines aren't re-ingested (AC-c).
  filebeat_registry_cloud:
    driver: local

  # FRE-910: parent mount for /app/telemetry — durable-by-default for every writer,
  # not just the ones a human remembered to mount individually. Nested volumes below
  # (captains_log, feedback_history, graph_quality, context_quality, error_patterns,
  # freshness_review) still own their own subtrees at their specific paths.
  seshat_telemetry_cloud:
    driver: local

  # Captain's Log — full directory (CL-*.json reflections + captures/)
  # Supersedes seshat_captures_cloud which only covered the captures/ subdirectory.
  seshat_captains_log_cloud:
    driver: local

  # Captain's Log captures legacy volume — kept for reference/rollback.
  # Not mounted; superseded by seshat_captains_log_cloud.
  seshat_captures_cloud:
    driver: local

  # Feedback history + poller state (ADR-0054 disk-durable records, persisted)
  # poller_state_path() now lives inside feedback_history/ so one volume covers both.
  seshat_feedback_history_cloud:
    driver: local

  # ADR-0054 durable JSONL legs of the Wave-3 self-improvement streams (FRE-598).
  # Previously written to the ephemeral container layer and lost on recreation.
  seshat_graph_quality_cloud:
    driver: local
  seshat_context_quality_cloud:
    driver: local
  seshat_error_patterns_cloud:
    driver: local
  seshat_freshness_review_cloud:
    driver: local

  # Shared workspace for run_python sandbox scratch dirs (FRE-261 Step 5)
  seshat_workspace_cloud:
    driver: local

networks:
  # Isolated bridge network for cloud simulation
  # Mimics the VPS internal network
  cloud-sim:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
