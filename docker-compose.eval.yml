# FRE-275 — Eval override: production-equivalent dual-instance stack
# FRE-375 — Eval substrate isolation: eval gateway containers use their own
#            postgres-eval / neo4j-eval / elasticsearch-eval services so eval
#            runs never touch production data.
# FRE-1342 — redis-eval: the eval gateways used to share production's Redis
#            (`redis://redis:6379/0`), which carries no KG data itself but
#            *transports* the Streams events that cause KG writes. Production's
#            consolidator was subscribed to those streams, so an eval turn's
#            `request.captured` would have reached it and written to the
#            production knowledge graph. A dedicated instance, not just a
#            separate DB index, because Streams consumer groups are per-DB but
#            the eval gateway would still share the instance and network.
#
#            CORRECTED 2026-08-30: an earlier revision of this note said the eval
#            turn "was consumed" by production's consolidator, and master escalated
#            the ticket as a live contamination path on that basis. It was LATENT,
#            not live — `event_bus_enabled` defaults to False and this file never
#            set it, so the eval gateways ran on NoOpBus and never published at all.
#            The isolation is still right, and now load-bearing: the bus is enabled
#            below, which is what would have armed the path.
#
# Layered on top of docker-compose.cloud.yml.  Adds two seshat-gateway
# instances (control + treatment) plus isolated eval substrate services.
# Docker DNS, GNU procps, and /app/* paths all match the prod container.
#
# Usage:
#
#   docker compose -f docker-compose.cloud.yml -f docker-compose.eval.yml \
#     up -d postgres-eval neo4j-eval elasticsearch-eval redis-eval \
#            seshat-gateway-control seshat-gateway-treatment
#
#   curl -fsS http://localhost:9002/health   # control
#   curl -fsS http://localhost:9003/health   # treatment
#
#   docker compose -f docker-compose.cloud.yml -f docker-compose.eval.yml \
#     down seshat-gateway-control seshat-gateway-treatment \
#          postgres-eval neo4j-eval elasticsearch-eval redis-eval
#
# Reusable for FRE-263 (PIVOT-4) and FRE-264 (PIVOT-5) evals.

# Shared base — referenced by both services below via YAML anchor.
# Not a real service; docker compose ignores top-level x-* keys.
x-seshat-gateway-eval-base: &seshat-gateway-eval-base
  build:
    context: .
    dockerfile: Dockerfile.gateway
  image: seshat-gateway:latest
  depends_on:
    postgres-eval:
      condition: service_healthy
    neo4j-eval:
      condition: service_healthy
    elasticsearch-eval:
      condition: service_healthy
    redis-eval:
      condition: service_healthy
    # FRE-1344: searxng is PRODUCTION's service, and a depends_on pulls it into the scope
    # of any `up` naming these gateways — observed recreating the live searxng container
    # (1ee1fb09d19a -> a49fce879e3d) during an eval bring-up, which is how FRE-1342's AC-3
    # failed despite the target naming eval services explicitly. `required: false` lets the
    # eval gateways address it by name without compose managing its lifecycle on their
    # behalf. Search is not needed for the gateway to become healthy.
    searxng:
      condition: service_started
      required: false
  volumes:
    # Eval-specific volumes — isolated from production captures and workspace.
    - seshat_captures_eval:/app/telemetry/captains_log/captures
    - seshat_workspace_eval:/app/agent_workspace
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/health')"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 60s
  mem_limit: 768m
  cpus: 1.0
  networks:
    - cloud-sim
  # Eval is one-shot; do not mask crashes with silent restarts
  restart: "no"

services:
  # ── Eval-specific substrate services ──────────────────────────────────────
  # These run alongside the cloud services on separate ports with separate
  # volumes.  Eval gateway containers connect to these; prod gateway continues
  # to connect to the cloud postgres/neo4j/elasticsearch services.

  # PostgreSQL (eval) — port 5434 on host, separate volume
  postgres-eval:
    image: pgvector/pgvector:pg17
    container_name: cloud-sim-postgres-eval
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: personal_agent
    volumes:
      - seshat_postgres_eval:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d personal_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - cloud-sim
    restart: "no"

  # Neo4j (eval) — bolt 7689 / HTTP 7476 on host, separate volume
  neo4j-eval:
    image: neo4j:5.26-community
    container_name: cloud-sim-neo4j-eval
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD required}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    volumes:
      - seshat_neo4j_eval:/data
    ports:
      - "127.0.0.1:7476:7474"  # HTTP Browser (eval)
      - "127.0.0.1:7689:7687"  # Bolt Driver (eval)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # FRE-1344: 15s was short of a cold Neo4j start on this host — measured 38s from
      # container start to "Started.", so eval-infra-up aborted on first invocation and
      # only worked on the retry. Production's neo4j allows 15s but starts from a warm
      # volume; a fresh eval volume pays full initialisation.
      start_period: 90s
    mem_limit: 768m
    cpus: 0.5
    networks:
      - cloud-sim
    restart: "no"

  # Elasticsearch (eval) — port 9202 on host, separate volume
  elasticsearch-eval:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    container_name: cloud-sim-elasticsearch-eval
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx512m"
    volumes:
      - seshat_es_eval:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9202:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 10s
      timeout: 5s
      retries: 5
      # FRE-1344: 20s did not cover a cold Elasticsearch start from a fresh volume on this
      # host — this was the service that actually aborted `eval-infra-up` first, and the
      # "dependency neo4j-eval failed to start" line alongside it was collateral. All four
      # eval substrate services reach healthy unattended; they just need to be allowed to.
      start_period: 120s
    mem_limit: 768m
    cpus: 0.5
    networks:
      - cloud-sim
    restart: "no"

  # Redis (eval) — port 6380 on host, separate instance and volume from
  # production's `redis` service (FRE-1342). The eval gateways' Streams event bus
  # must never overlap production's: production's consolidator is subscribed to
  # those streams, so a shared instance would let an eval turn's
  # `request.captured` reach it and write to the production knowledge graph.
  #
  # See the corrected note in this file's header: that path was latent rather than
  # live while the eval bus was disabled. It is no longer disabled, so this service
  # is what keeps the two apart. Verified with the producer enabled: production's
  # `stream:request.captured` sat at 1923 both before and after an eval turn that
  # demonstrably published, while eval's own stream went to 1.
  redis-eval:
    image: redis:7-alpine
    container_name: cloud-sim-redis-eval
    volumes:
      - seshat_redis_eval:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 128m
    cpus: 0.25
    networks:
      - cloud-sim
    restart: "no"
    command: redis-server --appendonly yes

  # ── Eval gateway instances ─────────────────────────────────────────────────

  # Control — curated tools only, primitives disabled
  seshat-gateway-control:
    <<: *seshat-gateway-eval-base
    container_name: cloud-sim-seshat-gateway-control
    environment:
      # Infrastructure wiring — eval substrate (isolated from prod)
      # App connects as the restricted `seshat_app` role (FRE-808); internal eval
      # stack falls back to the init.sql dev password when the secret is unset.
      # FRE-1344: keyed on SESHAT_APP_EVAL_PASSWORD, NOT production's SESHAT_APP_PASSWORD.
      # init.sql:648 creates the role with the literal 'seshat_app_dev_password' and
      # production installs its real secret separately via ALTER ROLE at deploy. Reading
      # production's variable here made the eval gateway present production's password to
      # a freshly-initialised eval database that only knows the dev one — a guaranteed
      # auth failure on any host with a populated .env. Eval credentials stay independent
      # of production's by construction (FRE-733's direction), so leave this unset.
      AGENT_DATABASE_URL: postgresql+asyncpg://seshat_app:${SESHAT_APP_EVAL_PASSWORD:-seshat_app_dev_password}@postgres-eval:5432/personal_agent
      AGENT_DATABASE_ADMIN_URL: postgresql+asyncpg://agent:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres-eval:5432/personal_agent
      AGENT_NEO4J_URI: bolt://neo4j-eval:7687
      AGENT_NEO4J_USER: neo4j
      AGENT_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD required}
      AGENT_ELASTICSEARCH_URL: http://elasticsearch-eval:9200
      # FRE-1344 / ADR-0112 AC-1: owner_storage_allowlist defaults to production's compose
      # service names (postgres, neo4j, elasticsearch), so the private profile rejected
      # every eval store and the gateway refused to boot. The eval services are the same
      # owner-controlled containers on the same host, so declaring them is what ADR-0112
      # intends — NOT a reason to set AGENT_SUBSTRATE_PROFILE=managed, which would disable
      # the check wholesale. The stale cached image predated this guard, which is why this
      # only surfaced once the image was rebuilt (FRE-1341).
      AGENT_OWNER_STORAGE_ALLOWLIST: '["postgres","neo4j","elasticsearch","postgres-eval","neo4j-eval","elasticsearch-eval"]'
      AGENT_EVENT_BUS_REDIS_URL: redis://redis-eval:6379/0
      AGENT_SEARXNG_BASE_URL: http://searxng:8080
      AGENT_DEPLOYMENT_PROFILE: eval
      # ADR-0132 D4: the eval profile uses "the endpoint its compose file declares;
      # never the dead loopback default". Declared literally, NOT via ${AGENT_SLM_BASE_URL:-…}
      # — .env defines that variable, so the interpolation let production's value win over
      # this file's, resolving to the container's own loopback. That is exactly the "dead
      # loopback default" D4 names, and it is the same shape as the SESHAT_APP_PASSWORD
      # inheritance bug (FRE-1344): an eval service silently reading production's env.
      #
      # The comment previously here claimed "evals must never traverse the Cloudflare egress
      # path (no CF credential is available to this stack)". That is wrong on its stated
      # reason: no gateway holds a CF credential. It was deliberately moved into Caddy
      # (see docker-compose.cloud.yml's gateway block, which warns that re-adding CF_ACCESS_*
      # would undo the custody move), and D4's own table records "CF concept in app config:
      # none" for every profile including cloud. Caddy performs the egress; the gateway just
      # addresses it by service name on the shared network, which the eval gateways join.
      #
      # Operational note, which IS the real constraint the CF story obscured: this reaches
      # the owner's local SLM, which runs at max_concurrency 1. Eval turns contend with the
      # owner's live turns. Pace multi-turn eval runs accordingly.
      AGENT_SLM_BASE_URL: http://caddy:8600
      # FRE-1342: `event_bus_enabled` defaults to False and this file never set it, so the
      # eval gateways have always run on NoOpBus. Two consequences worth stating, because
      # master got the first one wrong when escalating this ticket:
      #
      #  1. The production-contamination path this ticket fixes was LATENT, not live. The
      #     DSN did point at production's Redis and production's consumers were subscribed,
      #     but eval never published, so no eval turn ever reached them. The redis-eval fix
      #     is still correct — it removes the path before anything can arm it — but the
      #     severity was overstated.
      #  2. With no bus there is no consolidation, so no eval turn writes to ANY knowledge
      #     graph. That makes "an eval turn produces no production KG write" vacuously true,
      #     and it is why FRE-1337's behavioural arm 3, which measures entity extraction,
      #     could never have worked here regardless of the endpoint or credential fixes.
      #
      # Enabled explicitly and pointed at redis-eval, so eval exercises the same machinery
      # production does, against its own substrate.
      AGENT_EVENT_BUS_ENABLED: "true"
      AGENT_ANTHROPIC_API_KEY: ${AGENT_ANTHROPIC_API_KEY}
      AGENT_OPENAI_API_KEY: ${AGENT_OPENAI_API_KEY}
      API_HOST: 0.0.0.0
      API_PORT: "9001"
      APP_ENV: eval
      AGENT_LOG_LEVEL: "${AGENT_LOG_LEVEL:-info}"
      # Eval-specific: auth and MCP off; primitives off (baseline)
      # AGENT_OWNER_EMAIL is the dev-mode fallback when auth is disabled
      AGENT_OWNER_EMAIL: ${AGENT_OWNER_EMAIL:?AGENT_OWNER_EMAIL required}
      AGENT_GATEWAY_AUTH_ENABLED: "false"
      AGENT_MCP_GATEWAY_ENABLED: "false"
      AGENT_PRIMITIVE_TOOLS_ENABLED: "false"
      AGENT_PREFER_PRIMITIVES: "false"
      AGENT_CLOUD_WEEKLY_BUDGET_USD: "50.0"
    ports:
      # Host 9002 → container 9001 (uvicorn port is hardcoded in Dockerfile.gateway)
      - "127.0.0.1:9002:9001"

  # Treatment — primitives + skill docs enabled, approval gate off
  seshat-gateway-treatment:
    <<: *seshat-gateway-eval-base
    container_name: cloud-sim-seshat-gateway-treatment
    environment:
      # Infrastructure wiring — eval substrate (isolated from prod)
      # App connects as the restricted `seshat_app` role (FRE-808); internal eval
      # stack falls back to the init.sql dev password when the secret is unset.
      # FRE-1344: keyed on SESHAT_APP_EVAL_PASSWORD, NOT production's SESHAT_APP_PASSWORD.
      # init.sql:648 creates the role with the literal 'seshat_app_dev_password' and
      # production installs its real secret separately via ALTER ROLE at deploy. Reading
      # production's variable here made the eval gateway present production's password to
      # a freshly-initialised eval database that only knows the dev one — a guaranteed
      # auth failure on any host with a populated .env. Eval credentials stay independent
      # of production's by construction (FRE-733's direction), so leave this unset.
      AGENT_DATABASE_URL: postgresql+asyncpg://seshat_app:${SESHAT_APP_EVAL_PASSWORD:-seshat_app_dev_password}@postgres-eval:5432/personal_agent
      AGENT_DATABASE_ADMIN_URL: postgresql+asyncpg://agent:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres-eval:5432/personal_agent
      AGENT_NEO4J_URI: bolt://neo4j-eval:7687
      AGENT_NEO4J_USER: neo4j
      AGENT_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD required}
      AGENT_ELASTICSEARCH_URL: http://elasticsearch-eval:9200
      # FRE-1344 / ADR-0112 AC-1: owner_storage_allowlist defaults to production's compose
      # service names (postgres, neo4j, elasticsearch), so the private profile rejected
      # every eval store and the gateway refused to boot. The eval services are the same
      # owner-controlled containers on the same host, so declaring them is what ADR-0112
      # intends — NOT a reason to set AGENT_SUBSTRATE_PROFILE=managed, which would disable
      # the check wholesale. The stale cached image predated this guard, which is why this
      # only surfaced once the image was rebuilt (FRE-1341).
      AGENT_OWNER_STORAGE_ALLOWLIST: '["postgres","neo4j","elasticsearch","postgres-eval","neo4j-eval","elasticsearch-eval"]'
      AGENT_EVENT_BUS_REDIS_URL: redis://redis-eval:6379/0
      AGENT_SEARXNG_BASE_URL: http://searxng:8080
      AGENT_DEPLOYMENT_PROFILE: eval
      # ADR-0132 D4: the eval profile uses "the endpoint its compose file declares;
      # never the dead loopback default". Declared literally, NOT via ${AGENT_SLM_BASE_URL:-…}
      # — .env defines that variable, so the interpolation let production's value win over
      # this file's, resolving to the container's own loopback. That is exactly the "dead
      # loopback default" D4 names, and it is the same shape as the SESHAT_APP_PASSWORD
      # inheritance bug (FRE-1344): an eval service silently reading production's env.
      #
      # The comment previously here claimed "evals must never traverse the Cloudflare egress
      # path (no CF credential is available to this stack)". That is wrong on its stated
      # reason: no gateway holds a CF credential. It was deliberately moved into Caddy
      # (see docker-compose.cloud.yml's gateway block, which warns that re-adding CF_ACCESS_*
      # would undo the custody move), and D4's own table records "CF concept in app config:
      # none" for every profile including cloud. Caddy performs the egress; the gateway just
      # addresses it by service name on the shared network, which the eval gateways join.
      #
      # Operational note, which IS the real constraint the CF story obscured: this reaches
      # the owner's local SLM, which runs at max_concurrency 1. Eval turns contend with the
      # owner's live turns. Pace multi-turn eval runs accordingly.
      AGENT_SLM_BASE_URL: http://caddy:8600
      # FRE-1342: `event_bus_enabled` defaults to False and this file never set it, so the
      # eval gateways have always run on NoOpBus. Two consequences worth stating, because
      # master got the first one wrong when escalating this ticket:
      #
      #  1. The production-contamination path this ticket fixes was LATENT, not live. The
      #     DSN did point at production's Redis and production's consumers were subscribed,
      #     but eval never published, so no eval turn ever reached them. The redis-eval fix
      #     is still correct — it removes the path before anything can arm it — but the
      #     severity was overstated.
      #  2. With no bus there is no consolidation, so no eval turn writes to ANY knowledge
      #     graph. That makes "an eval turn produces no production KG write" vacuously true,
      #     and it is why FRE-1337's behavioural arm 3, which measures entity extraction,
      #     could never have worked here regardless of the endpoint or credential fixes.
      #
      # Enabled explicitly and pointed at redis-eval, so eval exercises the same machinery
      # production does, against its own substrate.
      AGENT_EVENT_BUS_ENABLED: "true"
      AGENT_ANTHROPIC_API_KEY: ${AGENT_ANTHROPIC_API_KEY}
      AGENT_OPENAI_API_KEY: ${AGENT_OPENAI_API_KEY}
      API_HOST: 0.0.0.0
      API_PORT: "9001"
      APP_ENV: eval
      AGENT_LOG_LEVEL: "${AGENT_LOG_LEVEL:-info}"
      # Eval-specific: auth and MCP off; primitives on + auto-approve bash
      AGENT_OWNER_EMAIL: ${AGENT_OWNER_EMAIL:?AGENT_OWNER_EMAIL required}
      AGENT_GATEWAY_AUTH_ENABLED: "false"
      AGENT_MCP_GATEWAY_ENABLED: "false"
      AGENT_PRIMITIVE_TOOLS_ENABLED: "true"
      AGENT_PREFER_PRIMITIVES: "true"
      # Required: without this, bash commands block indefinitely for PWA approval
      AGENT_APPROVAL_UI_ENABLED: "false"
      AGENT_CLOUD_WEEKLY_BUDGET_USD: "50.0"
    ports:
      # Host 9003 → container 9001
      - "127.0.0.1:9003:9001"

volumes:
  # Eval-specific volumes — isolated from production
  seshat_captures_eval:
    driver: local
  seshat_workspace_eval:
    driver: local
  seshat_postgres_eval:
    driver: local
  seshat_neo4j_eval:
    driver: local
  seshat_es_eval:
    driver: local
  seshat_redis_eval:
    driver: local

networks:
  # Isolated bridge network for cloud simulation
  # Mimics the VPS internal network
  cloud-sim:
    driver: bridge
