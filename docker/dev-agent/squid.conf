# Egress proxy of the dev-agent network (ADR-0159 D4.5; FRE-1682).
#
# The agent container has no route out. This proxy is its only exit. It tunnels HTTPS (CONNECT) to
# one host, registry.npmjs.org, on port 443. It refuses everything else: plain HTTP, other ports,
# other hosts, and any numeric (IP) destination. The rules below are checked in order. The first
# match decides, and the last rule denies.
#
# -n on an ACL turns off reverse-DNS matching. Without it, a numeric destination could be matched
# back to the allowed name. tests/scripts/test_dev_agent_compose.py pins this file.

http_port 3128
pid_filename none
coredump_dir /tmp

# No cache, no disk, no extra headers. Logs go to the container's stdout and stderr.
cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
logfile_rotate 0
forwarded_for delete
via off
dns_v4_first on

acl CONNECT method CONNECT
acl tls_port port 443
acl numeric_authority dstdom_regex -n -i ^[0-9.]+$ ^\[?[0-9a-f:]+\]?$
acl npm_registry dstdomain -n registry.npmjs.org

http_access deny !CONNECT
http_access deny numeric_authority
http_access deny !tls_port
http_access allow npm_registry
http_access deny all
