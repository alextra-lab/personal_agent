skill: artifact-design
scenarios:
  - prompt: "Make a one-page HTML report for the owner. It needs a bar chart of spend per quarter and the margin formula typeset as math."
    expect: >-
      The answer is one complete HTML document. Chart.js and KaTeX load from the exact absolute
      pinned `/lib/` URLs of the shelf. The KaTeX stylesheet link is present. The canvas has
      explicit `width` and `height`, and the chart data is inline. No other CDN is used.
  - prompt: "Build a standalone HTML page with a slowly rotating 3-D solid that I can open with no network."
    expect: >-
      The answer is one complete HTML document that uses the global `THREE` from the pinned
      shelf URL, not an ES module import. Geometry is built in code. No texture or model is
      fetched. No API key or internal host name is in the file.
  - prompt: "Write an explorable HTML walkthrough of a Python function with highlighted code and long-form prose that looks like a printed article."
    expect: >-
      The answer is one complete HTML document. Code is in `<pre><code class="language-python">`
      and `hljs.highlightAll()` runs after `DOMContentLoaded`, with the theme stylesheet linked.
      Prose uses native CSS typography first, and the shelf fonts only through `@font-face`.
  - prompt: "I need a print layout for a 20-page booklet as an HTML artifact, with page margins and no split chapters."
    expect: >-
      The answer leads with native `@page`, `break-inside: avoid`, `widows` and `orphans`. It
      treats paged.js as experimental and does not rely on it as the only route.
