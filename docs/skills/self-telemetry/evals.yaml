skill: self-telemetry
scenarios:
  - prompt: "What was the prompt cache hit rate of my model calls in the last 24 hours?"
    expected_skill: self-telemetry
    expect: "Calls query_telemetry on agent-logs for model_call_completed and sums input_tokens and cache_read_tokens. States the formula and the window. Does not use cache_read_input_tokens on this event."
  - prompt: "How much did we spend yesterday in total, embeddings and reranking included?"
    expected_skill: self-telemetry
    expect: "Uses api_cost_recorded, by provider or by day, and says that the total includes embedding and rerank cost. Does not use model_call_completed alone."
  - prompt: "How close is the daily budget to its cap right now?"
    expected_skill: self-telemetry
    expect: "Reads the latest budget_counter_snapshot per role and time_window with the curl recipe, because the tool does not list those fields. Reports running_total, cap_usd and utilization_ratio."
  - prompt: "How did my last ten interactions end? Did any fail?"
    expected_skill: self-telemetry
    expect: "Reads the Captain's Log captures with the curl recipe, newest first, and counts the outcomes. Names the time range of the ten."
