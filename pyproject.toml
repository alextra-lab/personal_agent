[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# This project is designed to be friendly with `uv` for environment and
# dependency management. A typical workflow would be:
#   uv sync --extra dev   # install runtime + dev dependencies (a bare `uv sync` removes the dev extra)
#   uv run ...  # run CLI or scripts

[project]
name = "personal-ai-agent"
version = "0.1.0"
description = "Research project: Personal local AI collaborator exploring cognitive architectures and agentic systems (learning/research, not production-ready)."
readme = "README.md"
requires-python = ">=3.12"

license = { text = "MIT" }

authors = [
  { name = "Alex Afflerbach" }
]

dependencies = [
  # Core building blocks for the personal agent runtime
  "pydantic>=2.10.0",     # structured config and typed data models
  "pydantic-settings>=2.14.2",  # environment variable integration for Pydantic; FRE-1323 Dependabot — GHSA-4xgf-cpjx-pc3j (was 2.0.0 floor)
  "python-dotenv>=1.0.0",  # .env file loading
  "httpx>=0.27.0",        # async-capable HTTP client for web-augmented reasoning
  "structlog>=24.0.0",    # structured logging (works well with metrics/observability later)
  "typer>=0.12.0",        # ergonomic CLI/command entrypoints
  "rich>=13.9.0",         # nice terminal output for local UI / status views
  "pyyaml>=6.0.0",        # YAML parsing for governance configs
  "orjson>=3.9.0",        # fast JSON serialization (replaces stdlib json in performance-critical paths)
  "jsonschema>=4.20.0",   # tool argument schema validation (ToolDefinition → JSON Schema)
  "typing-extensions>=4.8.0",  # extended type hints (TypedDict, etc.) for compatibility
  "psutil>=5.9.0",        # system metrics for sensor polling
  "macmon-python>=0.1.0",  # Apple Silicon GPU metrics (no sudo required)
  "dspy>=3.1.0",          # DSPy framework for Captain's Log reflection (ChainOfThought) - ADR-0010
  "mcp>=2.2.0,<3",    # Model Context Protocol SDK for MCP Gateway integration - ADR-0011; FRE-1625 — litellm 1.106.0 imports mcp.types.CacheableResult (2.x) on every tool call (litellm #46045); was >=1.28.1,<2.0.0 (FRE-1323)
  "pre-commit>=3.5.0",    # git hooks (required for all contributors)
  # Service layer (Phase 2.1)
  "fastapi>=0.109.0",     # async web framework for service API
  "uvicorn[standard]>=0.27.0",  # ASGI server for FastAPI
  # Database (PostgreSQL with async support)
  "sqlalchemy[asyncio]>=2.0.25",  # async ORM for database operations
  "asyncpg>=0.29.0",      # async PostgreSQL driver
  "alembic>=1.13.0",      # database migrations
  # Elasticsearch (async logging and search)
  "elasticsearch[async]>=8.11.0,<9.0.0",  # async Elasticsearch client (8.x for ES 8.19)
  # Neo4j (Phase 2.2 - memory graph)
  "neo4j>=5.15.0",        # Neo4j driver for knowledge graph
  "cryptography>=50.0.0",  # FRE-1323 Dependabot — GHSA-g6cj-pr64-35w5, was 48.0.1 (FRE-578); direct dep for test RSA key gen
  "litellm==1.106.0",  # FRE-1625 — exact pin: first release whose bundled map has gpt-6-luna, gpt-6.1-sol, claude-haiku-5-5, claude-sonnet-5-5 (1.105.1 lacks haiku-5-5); accepts reasoning_effort on gpt-6. Fallback 1.104.x
  # Event bus (ADR-0041 — Redis Streams)
  "redis[hiredis]>=5.0.0",
  "python-multipart>=0.0.30",  # FRE-578 Dependabot — quadratic-time DoS via semicolon querystring
  # Artifact substrate (ADR-0069 — R2-backed storage via S3 SDK)
  "aiobotocore>=2.13.0",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pypdfium2>=5.11.0",
  "pillow>=13.0.0",  # FRE-1711 Dependabot — 41 advisories, all fixed in 13.0.0 (major bump; call sites checked) (was 12.3.0; FRE-1323)
  "opentelemetry-sdk>=1.45.1",  # FRE-1711 — opentelemetry-api CVE-2026-114603 is fixed in 1.45.1; the SDK pins the API exactly, so the family moves together (was 1.44.0)
  "opentelemetry-exporter-otlp>=1.45.1",  # FRE-1711 — same family bump as opentelemetry-sdk (was 1.44.0)
  "opentelemetry-semantic-conventions==0.66b1",  # FRE-1711 — the version that opentelemetry-sdk 1.45.1 requires (was 0.65b0)
  "tzdata>=2024.1",  # FRE-1298 — python:3.12-slim has no system tz database; zoneinfo needs this
  "tree-sitter>=0.26.0",
  "tree-sitter-bash>=0.25.1",
]

[project.scripts]
agent = "personal_agent.ui.service_cli:app"

[project.optional-dependencies]
# Development tooling stack: linting, typing, and tests.
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",        # coverage reporting
  "mypy>=1.11.0",
  "ruff>=0.6.0",
  "ipython>=8.27.0",
  "bandit>=1.7.0",            # security linting
  "hypothesis>=6.0.0",        # property-based testing (optional)
  "pip-audit>=2.0.0"          # dependency vulnerability scanning
]

# FRE-697 — offline ONNX-reranker separation benchmark (VPS CPU, always-on private path).
# Torch-free: onnxruntime for in-process CPU inference + transformers for the tokenizer only
# (AutoTokenizer returns numpy; no torch import path). Eval-only — never in the prod gateway image.
# Install with: uv sync --extra onnx-eval
onnx-eval = [
  "onnxruntime>=1.19",
  "onnx>=1.16",          # onnxruntime.quantization.quantize_dynamic (int8) depends on the onnx proto lib
  "transformers>=4.51",
]

# Note: Backend inference servers (MLX, llama.cpp) have been moved to the slm_server project.
# Install them there: git clone https://github.com/alextra-lab/slm_server.git && cd slm_server && uv sync --extra mlx --extra llamacpp

# -----------------------------
# Dependency overrides (security)
# -----------------------------
# Force minimum secure versions for transitive dependencies (see pip-audit / Dependabot).
[tool.uv]
override-dependencies = [
  "aiohttp>=3.14.4",  # FRE-1711 Dependabot — 8 advisories incl. CVE-2026-111063..111066 and CVE-2026-111748..111750 (was 3.14.3; FRE-1323)
  "idna>=3.15",  # FRE-579 Dependabot — PYSEC-2026-215 crafted input DoS
  "pip>=26.2",  # FRE-1530 — PYSEC-2026-3721 doubly-encoded index URLs write outside the target (was 26.1; FRE-579)
  "cryptography>=50.0.0",  # FRE-1323 Dependabot — GHSA-g6cj-pr64-35w5 (was 48.0.1, FRE-578)
  "mako>=1.4.2",  # FRE-1711 Dependabot — one medium advisory fixed in 1.4.2 (was 1.3.12)
  "python-multipart>=0.0.30",  # FRE-578 Dependabot — quadratic-time DoS via semicolon (was 0.0.27)
  "pyjwt>=2.15.0",  # FRE-1530 — 13 advisories incl. CVE-2026-101918 (nested-JSON RecursionError) fixed in 2.15.0, CVE-2026-102265..102274 in 2.14.0 (was 2.13.0; FRE-578)
  "starlette>=1.3.1",  # FRE-578 Dependabot — SSRF via StaticFiles + form() limit bypass
  "pygments>=2.20.0",  # CVE-2026-4539
  "requests>=2.33.0",  # CVE-2026-25645
  "urllib3>=2.8.0",  # FRE-1530 — CVE-2026-97687/97688/97689 proxy TLS context mix-up, deflate loop, unbounded chunk-size buffering (was 2.7.0; CVE-2026-44431)
  "json-repair>=0.60.1",  # FRE-1323 Dependabot — GHSA-xf7x-x43h-rpqh, transitive via dspy; parses model output
  "msgpack>=1.2.3",  # FRE-1711 — CVE-2026-114613 (pip-audit), transitive via cachecontrol (was 1.2.1; GHSA-6v7p-g79w-8964, FRE-1323)
  "anyio>=4.14.2",  # FRE-1530 — CVE-2026-63374, CVE-2026-64847
  "click>=8.3.3",  # FRE-1530 — PYSEC-2026-2132
  "virtualenv>=21.14.10",  # FRE-1711 Dependabot — 13 advisories fixed through 21.14.9, plus GHSA-4f8h-vr72-p32c fixed in 21.14.10; via pre-commit, which the gateway image installs (was 21.7.13; FRE-1530)
  "filelock>=4.2.1",  # FRE-1711 Dependabot — CVE-2026-112909/112910/112915/112935/112939, major bump; no src/ import, used by virtualenv and huggingface-hub (was 3.25.2)
  "fsspec>=2026.6.0",  # FRE-1711 Dependabot — PYSEC-2026-4217 (was 2026.2.0)
  "multidict>=6.9.1",  # FRE-1711 Dependabot — PYSEC-2026-4244 (was 6.7.1)
  "certifi>=2026.10.19",  # FRE-1711 — PYSEC-2026-4320 fixed in 2026.10.19 (pip-audit, no Dependabot alert) (was 2026.2.25)
  # diskcache 5.6.3 — PYSEC-2026-2447 (pickle read from the cache dir), NO fixed release, so no floor.
  # Exposure (FRE-1530, measured 2026-10-01): transitive via dspy, whose default on-disk LLM-response
  # cache is the only use here. DSPY_CACHEDIR is unset, so the cache is $HOME/.dspy_cache — in the
  # gateway container /root/.dspy_cache, not a mounted volume. Exploiting it needs write access to
  # that directory; no network path writes there. Not exploitable from outside. Recheck when a fix
  # ships, and if DSPY_CACHEDIR is ever pointed at a mounted volume.
]

# -----------------------------
# Testing configuration
# -----------------------------

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
norecursedirs = ["tests/archive", ".venv", "venv", "build", "dist", ".git"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
  "requires_llm_server: marks tests that require LLM server running",
  "evaluation: marks evaluation path tests (require live agent on port 9000)",
]

# -----------------------------
# Type checking (mypy)
# -----------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# Common strictness flags (can be relaxed per-module later)
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

exclude = [
  "venv",
  ".venv",
  "build",
  "dist",
  "scripts/archive",
  "tests/archive",
]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

# -----------------------------
# Ruff (linting + formatting)
# -----------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
exclude = ["venv", ".venv", "build", "dist", "scripts/archive", "tests/archive"]

[tool.ruff.lint]
# Core rule families: errors, warnings, bugbear, imports, and docstrings.
select = ["E", "F", "B", "I", "D"]
# Ignore some stylistic rules that are often noisy.
ignore = ["E501", "D203", "D213"]
# Avoid auto-fixing potentially risky bugbear rules.
unfixable = ["B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# -----------------------------
# Setuptools package discovery
# -----------------------------

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["personal_agent*"]

# -----------------------------
# Bandit (security linting)
# -----------------------------

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101"]  # Skip assert_used (fine in tests)

[dependency-groups]
dev = [
    "mypy>=1.19.1",
]
