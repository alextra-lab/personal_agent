  - doc_id: d08-httpx-client
    partition: dev
    user_message: "Show me how to fetch a URL asynchronously."
    text: |
      Here's a minimal async fetch:

      ```python
      import httpx


      async def fetch(url: str) -> str:
          async with httpx.AsyncClient() as client:
              response = await client.get(url, timeout=10.0)
              return response.text
      ```

      `AsyncClient.get` accepts a `timeout=` argument in seconds.
    spans:
      - text: "import httpx"
        label: claim_non_exempt
        span_class: dependency_declaration
      - text: "async with httpx.AsyncClient() as client:"
        label: claim_exempt
        span_class: code_body
      - text: "response = await client.get(url, timeout=10.0)"
        label: claim_exempt
        span_class: code_body
      - text: "`AsyncClient.get` accepts a `timeout=` argument in seconds"
        label: claim_non_exempt
        span_class: prose_about_code
        note: "Use versus assert: the call above is a proposal to run; this is a claim about the API."

