# FRE-1281 — labelled span-extraction corpus (ADR-0138 D1, AC-7)
#
# Labelled by hand against ADJUDICATION.md v1, BEFORE any extractor existed. The commit
# introducing this file precedes the first line of personal_agent.grounding; git log is
# the artifact history the ticket's AC-5 asks for.
#
# Labelling is COMPLETE OVER CLAIMS: every claim in every document is labelled. Text
# carrying no span makes no claim about the world — that is what makes precision
# measurable, since a prediction over unlabelled text is a false positive rather than a
# labelling gap. A handful of NOT_A_CLAIM spans are recorded explicitly where the call is
# interesting enough to be worth pinning.
#
# Documents are grounded but invented — no transcripts, no PII, no deployment
# identifiers (public repo; test_fre1281_corpus.py enforces the denylist).
#
# partition: dev documents may be inspected per-document while iterating; heldout
# documents are reported in aggregate only (report.py cannot emit their diffs).

schema_version: 1
corpus_version: "2026-08-24.1"

documents:

  # ── factual claims, with and without named entities ──────────────────────────

  - doc_id: d01-tuna-brands
    partition: dev
    user_message: "Which tinned tuna should I buy in France?"
    text: |
      Ortiz is a Spanish brand sold in most French supermarkets, and its yellowfin is
      packed in olive oil. Yellowfin generally carries less mercury than bigeye. I'd
      recommend it if you can find it.
    spans:
      - text: "Ortiz is a Spanish brand sold in most French supermarkets"
        label: claim_non_exempt
        span_class: factual_entity
      - text: "its yellowfin is\npacked in olive oil"
        label: claim_non_exempt
        span_class: factual_entity
      - text: "Yellowfin generally carries less mercury than bigeye"
        label: claim_non_exempt
        span_class: factual_entity
        note: "A comparative, but over UNCITED attributes — not connective_evaluative."

