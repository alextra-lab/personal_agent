    history: boiler
    expected: expand
    message: "OK, now research the second option properly: installation cost in France, the grants I can get, and real owners' experience with noise and running costs."
  - label: boiler_decline
    history: boiler
    expected: decline
    message: "Thanks. Which of the three did you say is cheapest to install?"
  - label: lisbon_expand
    history: lisbon
    expected: expand
    message: "Good. Now research each of the three day trips you mentioned: opening days in November, train times from Lisbon, and ticket prices."
  - label: lisbon_decline
    history: lisbon
    expected: decline
    message: "Can you make that shorter, just one line per day?"
  - label: laptop_expand
    history: laptop
    expected: expand
    message: "OK, now research the second option: independent reviews of its screen colour accuracy, its real battery life, and current prices in France."
  - label: laptop_decline
    history: laptop
    expected: decline
    message: "What did you mean by colour gamut?"
  - label: tariffs_expand
    history: tariffs
    expected: expand
    message: "Now compare the three for my case: research the current 2026 price per kWh for each, the subscription cost at 9 kVA, and how many red days Tempo had last winter."
