    tool:
      query: "Vantor VX-206 firmware 2.3.1 release notes LACP"
      reasoning: >-
        The user asks about the LACP fix in Vantor firmware 2.3.1 and a two-port bond to the Tarn NAS.
        Memory has the NAS but not the changelog. Search for the release notes.
      marker: "S3@c09e5a1f7b2d4683"
      results:
        - title: "VX-206 firmware 2.3.1 release notes"
          url: "https://www.vantor-networks.com/support/vx-206/firmware/2.3.1"
          content: >-
            Fixed: an LACP bond of two or more ports could stop forwarding after a link flap on any member
            port, until the bond was removed and added again (issue VX-1182). Fixed: the web UI session
            expired after 5 minutes instead of 30. Changed: the default LACP rate is now slow (30 s); set
            it to fast in the bond settings to match Linux bonding defaults. Known issue: a static LAG
            with jumbo frames above 9000 bytes drops oversized frames silently.
        - title: "Vantor community: VX-1182 bond stops after link flap"
          url: "https://community.vantor-networks.com/t/vx-1182-bond-stops-after-link-flap/2210"
          content: >-
            Reported on 2.2.4 with a TrueNAS LACP bond. Pulling one cable stopped the whole bond. Vantor
            staff confirmed the fix in 2.3.1 and advised setting the LACP rate to fast on both ends.
    reply: >-
      Yes, it affects you. Before 2.3.1, an LACP bond could stop forwarding entirely after one member
      port flapped, until you removed and re-added the bond (issue VX-1182). A user hit exactly this
      with a TrueNAS bond.


      Two points for the Tarn NAS bond:

      - Update the switch to 2.3.1 before you build the bond.

      - 2.3.1 changes the default LACP rate to slow. TrueNAS uses fast, so set the bond on the switch
      to fast as well, or the two ends disagree on timing.


      Also note the known issue: a static LAG with jumbo frames above 9000 bytes drops large frames.
      LACP is not affected, but keep the MTU at 9000 or lower.

