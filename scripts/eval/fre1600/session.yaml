      ## What The User Thinks About Related Topics
      - The user prefers configuration in files over clicks in a web UI. [S2@d71c4a9e0b5f2368]
    reply: >-
      In TrueNAS SCALE 24.10:


      1. Network → Interfaces → Add. Type: Link Aggregation.

      2. Name: bond0. Protocol: LACP. Transmit hash policy: LAYER3+4. LACPDU rate: FAST.

      3. Members: the two 2.5 GbE ports. Remove their addresses first.

      4. Set the address on bond0 (static, VLAN 20 if the NAS sits there; otherwise untagged).

      5. MTU 9000 only if the switch ports and the nodes also use 9000.

      6. Test Changes, check that you can still reach the UI, then Save Changes within 60 seconds.


      On the switch, put both ports in one LACP group, rate fast.

