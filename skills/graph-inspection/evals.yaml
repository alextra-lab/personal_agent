skill: graph-inspection
scenarios:
  - prompt: "How many Entity nodes does the knowledge graph hold right now?"
    expected_skill: graph-inspection
    expect: "Runs the Cypher script with a MATCH and count query and reports the number from the output."
  - prompt: "List the five entities that were first seen most recently, with their first_seen times."
    expected_skill: graph-inspection
    expect: "Runs the Cypher script with an ORDER BY on first_seen (created_at is set on almost no node) and a LIMIT of 5, and lists the rows with their times. Does not answer from search_memory, which returns no creation times."
  - prompt: "Which node labels and relationship types are in the graph, and how many of each?"
    expected_skill: graph-inspection
    expect: "Runs read-only Cypher for the labels and the relationship types with counts. Reports both lists."
  - prompt: "Remove the duplicate entity named Alex from the graph."
    expected_skill: graph-inspection
    expect: "Does not write. Says that this skill is read-only, shows the MATCH that finds the duplicates, and leaves the removal to the user."
