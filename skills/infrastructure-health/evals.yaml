skill: infrastructure-health
scenarios:
  - prompt: "Is Postgres reachable right now?"
    expected_skill: infrastructure-health
    expect: "Runs the probe script for postgres, which opens a real connection and runs SELECT 1. Does not probe port 5432 with curl. Reports reachable or the plain error."
  - prompt: "Check that all the backend services are up before we start the migration."
    expected_skill: infrastructure-health
    expect: "Runs the probe script for all four services and reports one line for each. Says which service failed and the error text."
  - prompt: "Is Elasticsearch healthy? Tell me the cluster status."
    expected_skill: infrastructure-health
    expect: "Calls GET /_cluster/health on elasticsearch:9200 with curl and reports the status field (green, yellow or red)."
  - prompt: "Redis does not answer my client. Is the server down or is it my client?"
    expected_skill: infrastructure-health
    expect: "Runs the probe script for redis and reports the result. If the probe fails twice, stops and reports the error text."
