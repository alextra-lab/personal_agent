skill: turn-forensics
scenarios:
  - prompt: "Trace 883b6190 was very slow. Where did the time go?"
    expected_skill: turn-forensics
    expect: "Builds the per-call timeline of that one trace, finds the step that took the time, and names the call or tool. Pulls the data and does not guess."
  - prompt: "The context counter jumped to 47K on the last turn. What caused it?"
    expected_skill: turn-forensics
    expect: "Reads input_tokens for each primary call, finds the jump, and names the tool result before it, for example a whole-file read. Cross-checks the file size."
  - prompt: "Replay the last turn of session s-4411 step by step: what did each call and each tool do, in order?"
    expected_skill: turn-forensics
    expect: "Finds the trace of that turn first, then lists the calls and tool calls in time order."
  - prompt: "Did the browser really receive an error for the last turn of session s-4411?"
    expected_skill: turn-forensics
    expect: "Reads the session_events rows of that session (a documented ask) and reports the RUN_ERROR rows with their sequence numbers."
